<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Withdraw Funds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
            },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 80px;
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .btn-primary {
        background: #3b82f6;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: #2563eb;
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      }
      .note {
        background: #3b82f6;
      }
      .small-loading-spinner {
        border: 3px solid #f9f8f8;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body style="display: none" class="font-poppins">
    <div class="lg:p-4 max-w-4xl mx-auto w-full">
      <div id="header" class="sticky top-0 z-[1000]"></div>

      <div class="px-4 lg:px-0 main-content">
        <form
          id="withdrawForm"
          class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg card p-6 space-y-6 my-8"
        >
        <div class="space-y-4">
          <h2
            class="text-2xl font-bold text-gray-800 mb-2 flex items-center justify-center"
          >
            <i class="fas fa-wallet text-primary-500 mr-2"></i> Withdraw Funds
          </h2>
          <p class="text-gray-600 text-sm text-center">
            Select your wallet and enter the amount you wish to withdraw.
          </p>
          <p class="note p-2 text-white text-sm font-semibold rounded-lg">
            Note: Withdrawals are only from 9am to 6pm daily 
          </p>
</div>
          <div>
            <label class="block text-gray-700 font-medium mb-1"
              >Select Wallet</label
            >
            <select
              id="walletSelect"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500"
            >
              <option value="">-- Choose Wallet --</option>
              <option value="investment">Investment Wallet</option>
              <option value="welfare">Welfare Wallet</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-700 font-medium mb-1"
              >Amount (₦)</label
            >
            <input
              id="withdrawAmount"
              type="number"
              placeholder="Enter amount to withdraw"
              min="1"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-500"
            />
            <p id="amountError" class="text-red-500 text-sm mt-1 hidden">
              Please enter a valid amount (₦2,000 minimum)
            </p>
          </div>

          <button
            id="withdrawBtn"
            type="submit"
            class="btn-primary w-full text-white font-semibold py-3 px-6 rounded-lg flex items-center justify-center"
          >
            <span>Proceed</span>
            <i class="fas fa-arrow-right ml-2"></i>
          </button>
        </form>
      </div>

      <div id="footer" class="fixed w-full md:sticky bottom-0 z-[1000]"></div>
    </div>

    <script type="module">
      import { showToast } from "./toast.js";

      import { authFetch, checkAuth } from "./auth.js";
      import { protectPage } from "./protect.js";

      function waitForHeaderUI() {
        return new Promise((resolve) => {
          const interval = setInterval(() => {
            if (typeof window.updateHeaderUI === "function") {
              clearInterval(interval);
              resolve();
            }
          }, 100);
        });
      }

      checkAuth().then(async (user) => {
        if (user) {
          document.body.style.display = "block";
          protectPage();
          await waitForHeaderUI();
          fetchUserDetails();
        } else {
          window.location.href = "/login.html";
        }
      });

      async function fetchUserDetails() {
        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/users/me",
            { credentials: "include" }
          );
          if (!res.ok) throw new Error("Failed to fetch user details");
          const userData = await res.json();
          // Update header if function is available
          console.log(userData);
          if (typeof window.updateHeaderUI === "function") {
            console.log(userData);
            updateHeaderUI(userData);
          }
        } catch (err) {
          console.error("Error fetching user details:", err);
        }
      }

      // Form handling
      const form = document.getElementById("withdrawForm");
      const amountInput = document.getElementById("withdrawAmount");
      const walletSelect = document.getElementById("walletSelect");
      const submitBtn = document.getElementById("withdrawBtn");
      const amountError = document.getElementById("amountError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        amountError.classList.add("hidden");

        const amount = parseFloat(amountInput.value);
        const wallet = walletSelect.value;

        if (!amount || amount < 2000) {
          amountError.classList.remove("hidden");
          return;
        }

        if (!wallet) {
          showToast({
            icon: "fas fa-exclamation-triangle",
            message: "Please select a wallet",
            type: "warning",
          });
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `    <div class="small-loading-spinner mr-2"></div>
 Please wait...`;

        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/withdrawals",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ amount, balanceType: wallet }),
            }
          );

          const data = await res.json();
          if (!res.ok)
            throw new Error(data.message || "Failed to request withdrawal");

          showToast({
            icon: "fas fa-check-circle",
            message: data.message,
            type: "success",
          });
          form.reset();
        } catch (err) {
          showToast({
            icon: "fas fa-times-circle",
            message: err.message,
            type: "error",
          });
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Proceed</span><i class="fas fa-arrow-right ml-2"></i>`;
        }
      });
    </script>
  </body>
</html>
