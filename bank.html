<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./api-config.js"></script>
  <script src="./protect.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Bank Info - GlobalStake AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #000000;
    }

    .gradient-bg {
      background: #00ff00;
    }
    
    .btn-gradient {
      background: #00ff00;
      transition: all 0.3s ease;
    }
  </style>

  <script src="./translator.js"></script>
  <link rel="stylesheet" href="./global.css">
  <script src="./shadcn-select.js"></script>
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md mx-auto border-x border-gray-800 bg-[#000000] min-h-screen relative shadow-xl">

    <!-- HEADER -->
    <div class="gradient-bg text-black pt-5 pb-8 px-5 rounded-b-[30px] shadow-md sticky top-0 z-40">
      <div class="flex justify-between items-center">
        <a href="javascript:history.back()" class="text-black text-base hover:opacity-80">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-base font-bold">Bind Bank Card</h1>
        <div class="w-5"></div>
      </div>
    </div>

    <!-- FORM -->
    <div class="p-4">
      <div class="bg-[#0a0f0c] border border-[#00ff00]/40 rounded-xl p-4 mb-6 flex items-start gap-3 text-xs text-[#00ff00]">
        <i class="fas fa-info-circle mt-0.5"></i>
        <p class="text-gray-300">Please ensure all bank information provided is accurate and matches your registered identity.</p>
      </div>

      <form class="space-y-4">
        <!-- Bank Name (Shadcn UI Select) -->
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-widest mb-2 pl-1">Bank Name</label>
          <div class="relative w-full shadcn-select" id="bank-select-wrapper">
            <select id="bank-select" class="hidden" tabindex="-1" aria-hidden="true" data-no-shadcn="true">
              <option value="" selected>Select Bank Provider</option>
              <option value="access">Access Bank</option>
              <option value="gtb">GTBank</option>
              <option value="first">First Bank</option>
              <option value="uba">UBA</option>
              <option value="zenith">Zenith Bank</option>
              <option value="opay">OPay</option>
              <option value="palmpay">PalmPay</option>
            </select>

            <!-- Shadcn Trigger Button -->
            <button
              type="button"
              id="bank-select-trigger"
              onclick="toggleShadcnSelect('bank-select-wrapper')"
              class="shadcn-select-trigger w-full flex items-center justify-between bg-[#0a0f0c] border border-[#00ff00] text-white text-[14px] font-bold rounded-xl py-3.5 px-4 shadow-[0_0_15px_rgba(0,255,0,0.15)] hover:border-[#00ff00] focus:outline-none focus:ring-2 focus:ring-[#00ff00]/30 transition-all duration-200 cursor-pointer text-left"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="select-value-text truncate flex items-center gap-2">Select Bank Provider</span>
              <i class="fas fa-chevron-down text-xs text-[#00ff00] transition-transform duration-200 ease-in-out select-chevron ml-2 shrink-0"></i>
            </button>

            <!-- Shadcn Popover Dropdown -->
            <div
              id="bank-select-content"
              class="shadcn-select-content absolute left-0 right-0 mt-2 bg-[#0a0f0c] border border-[#00ff00] rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.95),0_0_20px_rgba(0,255,0,0.25)] p-1.5 z-[100] hidden opacity-0 scale-95 -translate-y-1 transition-all duration-150 origin-top overflow-hidden max-h-60 overflow-y-auto no-scrollbar"
              role="listbox"
            >
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value=""
                aria-selected="true"
                onclick="chooseShadcnOption('bank-select-wrapper', '', 'Select Bank Provider')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check"></i>
                <span class="truncate">Select Bank Provider</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="access"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'access', 'Access Bank')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">Access Bank</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="gtb"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'gtb', 'GTBank')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">GTBank</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="first"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'first', 'First Bank')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">First Bank</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="uba"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'uba', 'UBA')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">UBA</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="zenith"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'zenith', 'Zenith Bank')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">Zenith Bank</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="opay"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'opay', 'OPay')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">OPay</span>
              </div>
              <div
                class="shadcn-select-item group relative flex items-center w-full py-2.5 pl-8 pr-3 text-xs font-semibold rounded-lg text-white hover:bg-[#00ff00] hover:text-black cursor-pointer transition-colors"
                role="option"
                data-value="palmpay"
                aria-selected="false"
                onclick="chooseShadcnOption('bank-select-wrapper', 'palmpay', 'PalmPay')"
              >
                <i class="fas fa-check text-[#00ff00] group-hover:text-black text-xs absolute left-2.5 item-check hidden"></i>
                <span class="truncate">PalmPay</span>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-widest mb-2 pl-1">Account Number</label>
          <input type="text" class="w-full bg-[#0a0f0c] border border-[#00ff00] rounded-xl py-3.5 px-4 text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#00ff00]/30" placeholder="e.g. 0123456789">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-widest mb-2 pl-1">Account Name</label>
          <input type="text" class="w-full bg-[#121614] border border-gray-800 rounded-xl py-3.5 px-4 text-gray-400 text-sm focus:outline-none" placeholder="Enter Account number first" readonly>
          <p class="text-[10px] text-gray-500 mt-1 ml-1">Account name resolves automatically.</p>
        </div>

        <button type="button" class="w-full btn-gradient py-4 mt-6 rounded-xl text-black font-extrabold text-sm shadow-[0_0_20px_rgba(0,255,0,0.3)] hover:brightness-110 active:scale-[0.99] transition-all">
          Save Bank Info
        </button>
      </form>
    </div>
  </div>
</body>
</html>
