<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Invites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              teal: {
                50: "#f0fdfa",
                100: "#ccfbf1",
                200: "#99f6e4",
                300: "#5eead4",
                400: "#2dd4bf",
                500: "#14b8a6",
                600: "#0d9488",
                700: "#0f766e",
                800: "#115e59",
                900: "#134e4a",
              },
            },
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              roboto: ["Roboto", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .status-badge {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-active {
        background-color: #d1fae5;
        color: #065f46;
      }
      .status-pending {
        background-color: #fef3c7;
        color: #92400e;
      }
      .status-inactive {
        background-color: #fee2e2;
        color: #b91c1c;
      }
      .btn-primary {
        background: #3B82F6;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      }
      .loading-spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @media (min-width: 768px) {
        body {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body style="display: none;" class="font-poppins">
    <div class="lg:p-4 max-w-4xl mx-auto">
      <div id="header" class="sticky top-0 z-[1000]"></div>
      <div class="px-4 lg:px-0">
        <div class="mb-8">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
            <div class="bg-white rounded-lg shadow p-4 card">
              <div class="flex items-center">
                <div class="rounded-full bg-blue-100 p-3 mr-4">
                  <i class="fas fa-users text-blue-600"></i>
                </div>
                <div>
                  <p class="text-gray-500 text-sm">Total Invites</p>
                  <p id="totalReferrals" class="text-2xl font-bold">0</p>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg shadow p-4 card">
              <div class="flex items-center">
                <div class="rounded-full bg-green-100 p-3 mr-4">
                  <i class="fas fa-check-circle text-green-600"></i>
                </div>
                <div>
                  <p class="text-gray-500 text-sm">Active Accounts</p>
                  <p id="activeReferrals" class="text-2xl font-bold">0</p>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-lg shadow p-4 card">
              <div class="flex items-center">
                <div class="rounded-full bg-yellow-100 p-3 mr-4">
                  <i class="fas fa-clock text-yellow-600"></i>
                </div>
                <div>
                  <p class="text-gray-500 text-sm">Inactive Accounts</p>
                  <p id="inactiveReferrals" class="text-2xl font-bold">0</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg card overflow-hidden mb-8">
          <div
            class="p-6 border-b border-gray-200 flex justify-between items-center"
          >
            <h3 class="text-lg font-semibold text-gray-800">Invited Users</h3>
          </div>

          <div
  id="referralsContainer"
  class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 "
>
  <div class="flex flex-col items-center justify-center w-full  col-span-full">
    <div class="loading-spinner mb-2"></div>
    <p class="text-gray-500 font-medium">Loading referrals...</p>
  </div>
</div>

        </div>
      </div>
      <div
        id="footer"
        class="fixed w-full md:sticky bottom-0 z-[1000] border-3 border-red-500"
      ></div>
    </div>

 <script type="module">
import { authFetch, checkAuth } from "./auth.js";
import { protectPage } from "./protect.js";

checkAuth().then(async (user) => {
  if (user) {
    document.body.style.display = "block"; // reveal page
    protectPage(); // safe to load header/footer

    await loadReferrals(); // only load referrals when authenticated
    await fetchUserDetails(); // wait after referrals, avoids race
  } else {
    window.location.href = "/login.html";
  }
});

async function loadReferrals() {
  try {
    const res = await authFetch("https://neo-invest-server.onrender.com/api/users/referrals", {
      credentials: "include",
      headers: { "Content-Type": "application/json" },
    });

    if (!res.ok) throw new Error("Failed to fetch referrals");

    const { data } = await res.json();

    // Update counters
    document.getElementById("totalReferrals").textContent = data.totalReferrals;
    document.getElementById("activeReferrals").textContent = data.activeReferrals;
    document.getElementById("inactiveReferrals").textContent = data.inactiveReferrals;

    // Render user cards
    const container = document.getElementById("referralsContainer");
    container.innerHTML = "";

    if (data.referredUsers.length === 0) {
      container.innerHTML =
        '<p class="text-gray-500 text-center col-span-full">No referrals yet.</p>';
      return;
    }

    data.referredUsers.forEach((user) => {
      const initials = user.username
        ? user.username
            .split(" ")
            .map((n) => n[0])
            .join("")
            .toUpperCase()
        : "NA";

      let statusClass =
        user.accountStatus === "active"
          ? "status-active"
          : user.accountStatus === "inactive"
          ? "status-inactive"
          : "status-pending";

      container.innerHTML += `
        <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
          <div class="flex items-center">
            <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold mr-3">
              ${initials}
            </div>
            <div>
              <p class="font-medium">${user.username}</p>
              <span class="status-badge ${statusClass} text-xs">${user.accountStatus}</span>
            </div>
          </div>
          <button class="text-blue-600 hover:text-blue-800">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      `;
    });
  } catch (err) {
    console.error(err);
    document.getElementById("referralsContainer").innerHTML =
      '<p class="text-red-500">Error loading referrals.</p>';
  }
}

async function fetchUserDetails() {
  try {
    const res = await authFetch("https://neo-invest-server.onrender.com/api/users/me", { credentials: "include" });
    if (!res.ok) throw new Error("Failed to fetch user details");
    const userData = await res.json();

    if (typeof window.updateHeaderUI === "function") {
      updateHeaderUI(userData);
    }
  } catch (err) {
    console.error("Error fetching user details:", err);
  }
}

  </script> 
  </body>
</html>
