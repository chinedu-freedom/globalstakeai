<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./api-config.js"></script>
  <script src="./protect.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>Blockvextrade - Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #000000;
    }

    .gradient-bg {
      background: #00ff00;
    }
  </style>

  <script src="./translator.js"></script>
  <link rel="stylesheet" href="./global.css">
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md mx-auto border-x border-gray-100 bg-[#000000] min-h-screen relative shadow-xl">

    <!-- HEADER -->
    <div class="gradient-bg text-white pt-5 pb-8 px-5 rounded-b-[30px] shadow-md sticky top-0 z-40">
      <div class="flex justify-between items-center">
        <a href="javascript:history.back()" class="text-white text-base">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-base font-semibold">Messages</h1>
        <div class="w-5"></div>
      </div>
    </div>

    <!-- LIST -->
    <div class="p-3">
      <div class="flex flex-col items-center justify-center mt-20">
        <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-4">
          <i class="fas fa-bell-slash text-[#00ff00] text-4xl opacity-50"></i>
        </div>
        <p class="text-gray-500 font-medium">No messages yet</p>
      </div>
    </div>
  </div>
</body>
</html>
