<style>
body {
  font-family: "Poppins", sans-serif;
}

.gradient-bg {
  background: linear-gradient(135deg, #4f8cff, #6ee7ff);
}

.input {
  background: #f8fafc;
  border-radius: 12px;
  padding: 12px 16px;
  width: 100%;
  border: 1px solid #e5e7eb;
  outline: none;
  font-size: 14px;
}

.input:focus {
  border-color: #93c5fd;
}

.btn-gradient {
  background: linear-gradient(90deg, #5eead4, #93c5fd);
}

/* Country Picker */
.cc-trigger {
  display: flex;
  align-items: center;
  gap: 7px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-right: none;
  border-radius: 12px 0 0 12px;
  padding: 12px 10px 12px 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  white-space: nowrap;
  user-select: none;
  min-width: 90px;
  transition: background 0.2s;
}

.cc-trigger:hover {
  background: #f0f4ff;
}

/* Flag icon sizing */
.fi {
  width: 22px;
  height: 16px;
  border-radius: 3px;
  display: inline-block;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
}

.cc-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 280px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.12);
  z-index: 100;
  overflow: hidden;
  display: none;
  flex-direction: column;
}

.cc-dropdown.open {
  display: flex;
}

.cc-search-wrap {
  padding: 10px 12px;
  border-bottom: 1px solid #f3f4f6;
}

.cc-search {
  width: 100%;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
  outline: none;
  font-family: "Poppins", sans-serif;
}

.cc-search:focus {
  border-color: #93c5fd;
}

.cc-list {
  max-height: 220px;
  overflow-y: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.cc-list::-webkit-scrollbar {
  display: none;
}

.cc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 12px;
  color: #374151;
  transition: background 0.15s;
}

.cc-item:hover {
  background: #f0f6ff;
}

.cc-item.selected {
  background: #e8efff;
  font-weight: 600;
  color: #2563eb;
}

.cc-item .code {
  min-width: 38px;
  font-weight: 600;
  color: #4b5563;
  font-size: 11px;
}

.cc-item.selected .code {
  color: #2563eb;
}

.cc-item .name {
  color: #374151;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.phone-input-group {
  display: flex;
  position: relative;
}

.phone-input-group .phone-input {
  flex: 1;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 0 12px 12px 0;
  padding: 12px 16px;
  font-size: 14px;
  outline: none;
  font-family: "Poppins", sans-serif;
}

.phone-input-group .phone-input:focus {
  border-color: #93c5fd;
}
</style>

<body class="flex flex-col min-h-screen">

<!-- HEADER -->
<div class="gradient-bg text-white text-center py-12 px-6 relative">
  <!-- Logo centered -->
  <div class="flex flex-col items-center">
    <div class=" h-16  overflow-hidden shadow-lg mb-3 border-2 border-white/30" style="background:#0a0f1e;">
      <img src="./logo.jpeg" alt="StakeWiseAI Logo" class="w-full h-full object-cover">
    </div>
    <h1 class="text-xl font-bold tracking-wide">StakeWiseAI</h1>
    <p class="text-[10px] uppercase font-semibold  tracking-[4px] text-white/75 mt-0.5">TECH</p>
  </div>
</div>

<!-- MAIN -->
<div class="flex-1 flex justify-center px-4">
<div class="bg-white w-full p-6">

<!-- Tabs -->
<div class="relative flex bg-gray-100 rounded-full p-1 mb-6">
  <div id="tabIndicator"
    class="absolute top-1 left-1 w-1/2 h-[calc(100%-8px)] rounded-full bg-gradient-to-r from-teal-300 to-blue-400 transition-all duration-300 ease-in-out">
  </div>
  <button id="loginTab" class="flex-1 py-2 relative z-10 text-white font-medium">Login</button>
  <button id="registerTab" class="flex-1 py-2 relative z-10 text-gray-500 font-medium">Register</button>
</div>

<!-- FORMS WRAPPER -->
<div class="relative h-[520px] overflow-hidden">

<!-- LOGIN FORM -->
<form id="loginForm" class="space-y-5 absolute w-full transition-all duration-500 ease-in-out opacity-100 translate-x-0" onsubmit="handleLogin(event)">

  <div>
    <label class="text-sm text-gray-500">Phone Number</label>
    <div class="phone-input-group mt-1" id="loginPhoneWrap">
      <div class="cc-trigger" id="loginCCTrigger" onclick="toggleCC('login')">
        <span class="fi" id="loginCCFlag"></span>
        <span id="loginCCCode">+234</span>
        <i class="fas fa-chevron-down text-[9px] text-gray-400 transition-transform duration-200" id="loginCCChevron"></i>
      </div>
      <div class="cc-dropdown" id="loginCCDropdown">
        <div class="cc-search-wrap">
          <input type="text" class="cc-search" placeholder="Search country..." oninput="filterCC('login', this.value)" id="loginCCSearch">
        </div>
        <div class="cc-list" id="loginCCList"></div>
      </div>
      <input type="text" id="loginPhone" class="phone-input" placeholder="Enter your number" oninput="clearErr('loginPhone')"/>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="loginPhoneErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Password</label>
    <div class="relative mt-1">
      <input type="password" id="loginPassword" class="input pr-10" placeholder="Enter your password" oninput="clearErr('loginPassword')"/>
      <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"></i>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="loginPasswordErr"></p>
  </div>

  <div class="flex items-center text-sm text-gray-500">
    <input type="checkbox" class="mr-2" id="loginAgreement" onchange="toggleLoginBtn()" />
    I have read and accept the
    <a href="/terms.html" class="text-blue-500 ml-1 cursor-pointer hover:underline">User Agreement</a>
  </div>

  <div class="text-center text-blue-500 text-sm">
    <a href="/forgotPassword.html">Forgot Password?</a>
  </div>

  <button type="submit" id="loginBtn" disabled
    class="w-full py-3 rounded-xl btn-gradient text-white font-semibold flex items-center justify-center gap-2 opacity-50 cursor-not-allowed transition-opacity duration-200">
    <span id="loginBtnText">Sign In</span>
    <i class="fas fa-spinner fa-spin hidden" id="loginSpinner"></i>
  </button>
</form>

<!-- REGISTER FORM -->
<form id="registerForm" class="space-y-5 absolute w-full h-full overflow-y-auto pr-2 transition-all duration-500 ease-in-out opacity-0 translate-x-full pointer-events-none" onsubmit="handleRegister(event)">

  <div>
    <label class="text-sm text-gray-500">Phone Number</label>
    <div class="phone-input-group mt-1" id="registerPhoneWrap">
      <div class="cc-trigger" id="registerCCTrigger" onclick="toggleCC('register')">
        <span class="fi" id="registerCCFlag"></span>
        <span id="registerCCCode">+234</span>
        <i class="fas fa-chevron-down text-[9px] text-gray-400 transition-transform duration-200" id="registerCCChevron"></i>
      </div>
      <div class="cc-dropdown" id="registerCCDropdown">
        <div class="cc-search-wrap">
          <input type="text" class="cc-search" placeholder="Search country..." oninput="filterCC('register', this.value)" id="registerCCSearch">
        </div>
        <div class="cc-list" id="registerCCList"></div>
      </div>
      <input type="text" id="registerPhone" class="phone-input" placeholder="Enter your number" oninput="clearErr('registerPhone')"/>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerPhoneErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Email</label>
    <input type="email" id="registerEmail" placeholder="Enter email" class="input mt-1" oninput="clearErr('registerEmail')"/>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerEmailErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Username</label>
    <input type="text" id="registerUsername" placeholder="Enter username" class="input mt-1" oninput="clearErr('registerUsername')"/>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerUsernameErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Password</label>
    <div class="relative mt-1">
      <input type="password" id="registerPassword" class="input pr-10" placeholder="Enter password" oninput="clearErr('registerPassword')"/>
      <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"></i>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerPasswordErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Confirm Password</label>
    <div class="relative mt-1">
      <input type="password" id="registerConfirmPassword" class="input pr-10" placeholder="Repeat password" oninput="clearErr('registerConfirmPassword')"/>
      <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"></i>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerConfirmPasswordErr"></p>
  </div>

  <div>
    <label class="text-sm text-gray-500">Invitation Code <span class="text-gray-400 text-xs">(Optional)</span></label>
    <input type="text" id="registerReferral" placeholder="Enter referral code" class="input mt-1"/>
  </div>

  <div>
    <div class="flex items-center text-sm text-gray-500">
      <input type="checkbox" class="mr-2" id="registerAgreement" onchange="toggleRegisterBtn(); clearErr('registerAgreement')" />
      I have read and accept the
      <a href="/terms.html" class="text-blue-500 ml-1 cursor-pointer hover:underline">User Agreement</a>
    </div>
    <p class="text-red-500 text-[11px] mt-1 hidden" id="registerAgreementErr"></p>
  </div>

  <button type="submit" id="registerBtn" disabled
    class="w-full py-3 rounded-xl btn-gradient text-white font-semibold flex items-center justify-center gap-2 opacity-50 cursor-not-allowed transition-opacity duration-200">
    <span id="registerBtnText">Register</span>
    <i class="fas fa-spinner fa-spin hidden" id="registerSpinner"></i>
  </button>
</form>

</div>
</div>
</div>

  const listEl = document.getElementById(`${form}CCList`);
  const q = filter.toLowerCase();
  const filtered = COUNTRIES.filter(c =>
    c.name.toLowerCase().includes(q) || c.code.includes(filter)
  );

  listEl.innerHTML = filtered.map(c => `
    <div class="cc-item ${selectedCC[form].iso === c.iso ? 'selected' : ''}"
         onclick="selectCC('${form}', '${c.iso}', '${c.code}', '${c.name.replace(/'/g,"\\'")}')">
      <span class="fi fi-${c.iso}" style="border-radius:3px;"></span>
      <span class="code">${c.code}</span>
      <span class="name">${c.name}</span>
    </div>
  `).join('');
}

function selectCC(form, iso, code, name) {
  selectedCC[form] = { iso, code, name };
  // Update trigger flag
  document.getElementById(`${form}CCFlag`).className = `fi fi-${iso}`;
  document.getElementById(`${form}CCCode`).textContent = code;
  toggleCC(form, false);
}

function toggleCC(form, forceState) {
  const dropdown = document.getElementById(`${form}CCDropdown`);
  const chevron  = document.getElementById(`${form}CCChevron`);
  const searchEl = document.getElementById(`${form}CCSearch`);

  const isOpen   = dropdown.classList.contains('open');
  const shouldOpen = forceState !== undefined ? forceState : !isOpen;

  // Close all first
  ['login','register'].forEach(f => {
    document.getElementById(`${f}CCDropdown`).classList.remove('open');
    document.getElementById(`${f}CCChevron`).style.transform = '';
  });

  if (shouldOpen) {
    buildCCList(form, '');
    if (searchEl) searchEl.value = '';
    dropdown.classList.add('open');
    chevron.style.transform = 'rotate(180deg)';
    setTimeout(() => searchEl && searchEl.focus(), 50);
  }
}

function filterCC(form, val) {
  buildCCList(form, val);
}

// Close on outside click
document.addEventListener('click', (e) => {
  ['login','register'].forEach(form => {
    const trigger  = document.getElementById(`${form}CCTrigger`);
    const dropdown = document.getElementById(`${form}CCDropdown`);
    if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      document.getElementById(`${form}CCChevron`).style.transform = '';
    }
  });
});

// Tab logic
const loginTab    = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const indicator   = document.getElementById("tabIndicator");
const loginForm   = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

loginTab.addEventListener("click", () => {
  indicator.style.transform = "translateX(0%)";
  loginForm.classList.remove("opacity-0", "-translate-x-full");
  loginForm.classList.add("opacity-100", "translate-x-0");
  registerForm.classList.add("opacity-0", "translate-x-full");
  registerForm.classList.remove("opacity-100", "translate-x-0");
  registerForm.classList.add("pointer-events-none");
  loginForm.classList.remove("pointer-events-none");
  loginTab.classList.replace("text-gray-500", "text-white");
  registerTab.classList.replace("text-white", "text-gray-500");
});

registerTab.addEventListener("click", () => {
  indicator.style.transform = "translateX(100%)";
  registerForm.classList.remove("opacity-0", "translate-x-full");
  registerForm.classList.add("opacity-100", "translate-x-0");
  loginForm.classList.add("opacity-0", "-translate-x-full");
  loginForm.classList.remove("opacity-100", "translate-x-0");
  loginForm.classList.add("pointer-events-none");
  registerForm.classList.remove("pointer-events-none");
  registerTab.classList.replace("text-gray-500", "text-white");
  loginTab.classList.replace("text-white", "text-gray-500");
});

// Password Toggle
document.querySelectorAll(".toggle-password").forEach(icon => {
  icon.addEventListener("click", () => {
    const input = icon.previousElementSibling;
    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  });
});

// Init flags on load
document.addEventListener('DOMContentLoaded', () => {
    ['login', 'register'].forEach(form => {
        const c = selectedCC[form];
        document.getElementById(`${form}CCFlag`).className = `fi fi-${c.iso}`;
        document.getElementById(`${form}CCCode`).textContent = c.code;
    });

    // Check for referral code in URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref') || urlParams.get('r');
    if (refCode) {
        const referralInput = document.getElementById('registerReferral');
        if (referralInput) {
            referralInput.value = refCode;
            // Optionally switch to register tab if ref code is present
            // document.getElementById('registerTab').click();
        }
    }

    // Auto-tick agreement checkbox if user accepted terms and came back
    if (sessionStorage.getItem('termsAccepted') === '1') {
        sessionStorage.removeItem('termsAccepted');
        // Tick both so whichever tab the user is on, they are ready
        const loginChk = document.getElementById('loginAgreement');
        const regChk   = document.getElementById('registerAgreement');
        if (loginChk) { loginChk.checked = true; toggleLoginBtn(); }
        if (regChk)   { regChk.checked   = true; toggleRegisterBtn(); }
    }
});

const API_BASE = 'https://stakewiseai-server.onrender.com';

function showToast(msg, type = 'success') {
  window.showToast({ message: msg, type: type });
}

// ─── BUTTON LOADING STATE ───
function setLoading(form, loading) {
  const btn     = document.getElementById(form + 'Btn');
  const btnText = document.getElementById(form + 'BtnText');
  const spinner = document.getElementById(form + 'Spinner');
  btn.disabled  = loading;
  if (loading) {
    btnText.textContent = '';
    spinner.classList.remove('hidden');
  } else {
    btnText.textContent = (form === 'login') ? 'Sign In' : 'Register';
    spinner.classList.add('hidden');
    // Restore disabled state based on checkbox
    if (form === 'login') toggleLoginBtn();
    if (form === 'register') toggleRegisterBtn();
  }
}

// ─── CHECKBOX TOGGLE HELPERS ───
function toggleLoginBtn() {
  const checked = document.getElementById('loginAgreement').checked;
  const btn     = document.getElementById('loginBtn');
  btn.disabled  = !checked;
  btn.classList.toggle('opacity-50', !checked);
  btn.classList.toggle('cursor-not-allowed', !checked);
  btn.classList.toggle('cursor-pointer', checked);
}

function toggleRegisterBtn() {
  const checked = document.getElementById('registerAgreement').checked;
  const btn     = document.getElementById('registerBtn');
  btn.disabled  = !checked;
  btn.classList.toggle('opacity-50', !checked);
  btn.classList.toggle('cursor-not-allowed', !checked);
  btn.classList.toggle('cursor-pointer', checked);
}

// ─── BUILD PHONE NUMBER ───
function buildPhone(form) {
  const countryCode = selectedCC[form].code;  // e.g. "+234"
  const number      = document.getElementById(`${form}Phone`).value.trim();
  // Strip any leading zero or + from the local number to avoid duplication
  const cleaned     = number.replace(/^0+/, '');
  return countryCode + cleaned; // => "+2348158052206"
}

// ─── INLINE FIELD ERROR HELPERS ───
function showErr(inputId, msg) {
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(inputId + 'Err');
  if (input) {
    input.style.borderColor = '#ef4444';
    input.style.outline = 'none';
  }
  if (errEl) {
    errEl.textContent = msg;
    errEl.classList.remove('hidden');
  }
}

function clearErr(inputId) {
  const input = document.getElementById(inputId);
  const errEl = document.getElementById(inputId + 'Err');
  if (input) input.style.borderColor = '';
  if (errEl) errEl.classList.add('hidden');
}

function showPhoneErr(form, msg) {
  const wrap = document.getElementById(`${form}PhoneWrap`);
  const errEl = document.getElementById(`${form}PhoneErr`);
  const phoneInput = document.getElementById(`${form}Phone`);
  if (phoneInput) phoneInput.style.borderColor = '#ef4444';
  if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
}

// ─── LOGIN HANDLER ───
async function handleLogin(e) {
  e.preventDefault();

  const rawPhone    = document.getElementById('loginPhone').value.trim();
  const password    = document.getElementById('loginPassword').value.trim();
  let hasError      = false;

  if (!rawPhone) {
    showPhoneErr('login', 'Phone number is required');
    hasError = true;
  }
  if (!password) {
    showErr('loginPassword', 'Password is required');
    hasError = true;
  }
  if (hasError) return;

  const phoneNumber = buildPhone('login');

  setLoading('login', true);
  try {
    const res  = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ phoneNumber, password, keepMeLoggedIn: true })
    });
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('isLoggedIn', 'true');
      const userPayload = data.data || data.user || data;
      if (userPayload) localStorage.setItem('userData', JSON.stringify(userPayload));
      if (userPayload?.username) localStorage.setItem('userName', userPayload.username);
      if (userPayload?.phoneNumber) localStorage.setItem('userPhone', userPayload.phoneNumber);
      showToast('Login successful!', 'success');
      setTimeout(() => window.location.href = '/index.html', 1200);
    } else {
      showToast(data.message || 'Invalid credentials. Please try again.', 'error');
    }
  } catch (err) {
    showToast('Network error. Please check your connection.', 'error');
  } finally {
    setLoading('login', false);
  }
}

// ─── REGISTER HANDLER ───
async function handleRegister(e) {
  e.preventDefault();

  const rawPhone   = document.getElementById('registerPhone').value.trim();
  const email      = document.getElementById('registerEmail').value.trim();
  const username   = document.getElementById('registerUsername').value.trim();
  const password   = document.getElementById('registerPassword').value.trim();
  const confirmPwd = document.getElementById('registerConfirmPassword').value.trim();
  const referralCode = document.getElementById('registerReferral').value.trim();
  const agreed     = document.getElementById('registerAgreement').checked;
  let hasError     = false;

  if (!rawPhone) {
    showPhoneErr('register', 'Phone number is required');
    hasError = true;
  }
  if (!email) {
    showErr('registerEmail', 'Email address is required');
    hasError = true;
  }
  if (!username) {
    showErr('registerUsername', 'Username is required');
    hasError = true;
  }
  if (!password || password.length < 6) {
    showErr('registerPassword', password ? 'Password must be at least 6 characters' : 'Password is required');
    hasError = true;
  }
  if (!confirmPwd || password !== confirmPwd) {
    showErr('registerConfirmPassword', !confirmPwd ? 'Please confirm your password' : 'Passwords do not match');
    hasError = true;
  }
  if (!agreed) {
    showErr('registerAgreement', 'You must accept the User Agreement');
    hasError = true;
  }
  if (hasError) return;

  const phoneNumber = buildPhone('register');
  const payload = { username, email, phoneNumber, password };
  if (referralCode) payload.referralCode = referralCode;

  setLoading('register', true);
  try {
    const res  = await fetch(`${API_BASE}/api/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      showToast('Account created! Please log in.', 'success');
      setTimeout(() => document.getElementById('loginTab').click(), 1500);
    } else {
      showToast(data.message || 'Registration failed. Please try again.', 'error');
    }
  } catch (err) {
    showToast('Network error. Please check your connection.', 'error');
  } finally {
    setLoading('register', false);
  }
}
</script>
