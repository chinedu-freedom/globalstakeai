<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Investment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              teal: {
                50: "#f0fdfa",
                100: "#ccfbf1",
                200: "#99f6e4",
                300: "#5eead4",
                400: "#2dd4bf",
                500: "#14b8a6",
                600: "#0d9488",
                700: "#0f766e",
                800: "#115e59",
                900: "#134e4a",
              },
            },
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              roboto: ["Roboto", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        min-height: 100vh;
        padding-bottom: 80px;
      }

      .welfare-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .welfare-card:hover {
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
        transform: translateY(-5px);
      }

      .welfare-header {
        background: #3b82f6;
        color: white;
        padding: 16px;
        text-align: center;
      }

      .welfare-price {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0ea5e9;
      }

      .btn-primary {
        background: #3b82f6;
        transition: all 0.3s ease;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      }

      .loading-spinner {
        border: 3px solid #f9f8f8;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      .small-loading-spinner {
        border: 3px solid #f9f8f8;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 768px) {
        body {
          padding-bottom: 0;
        }
      }
    </style>
  </head>

  <body style="display: none" class="font-poppins">
    <div class="lg:p-4 space-y-8 max-w-4xl mx-auto">
      <div id="header" class="sticky top-0 z-[1000]"></div>
      <div class="px-4 lg:px-0">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16"
          id="investment-container"
        ></div>
      </div>
      <div
        id="footer"
        class="fixed w-full md:sticky bottom-0 z-[1000] border-3 border-red-500"
      ></div>
    </div>

    <script type="module">
      import { showToast } from "./toast.js";
      import { authFetch, checkAuth } from "./auth.js";
      import { protectPage } from "./protect.js";

      checkAuth().then((user) => {
        if (user) {
          document.body.style.display = "block"; // reveal page
          protectPage(); // safe to load header/footer
          fetchUserDetails();
        } else {
          window.location.href = "/login.html";
        }
      });

      async function fetchUserDetails() {
        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/users/me",
            { credentials: "include" }
          );
          if (!res.ok) throw new Error("Failed to fetch user details");
          const userData = await res.json();
          // Update header if function is available
          if (typeof window.updateHeaderUI === "function") {
            updateHeaderUI(userData);
          }
        } catch (err) {
          console.error("Error fetching user details:", err);
        }
      }

      function generateInvestmentCards(plans) {
        const container = document.getElementById("investment-container");
        if (!plans || plans.length === 0) {
          container.innerHTML = `
      <div class="col-span-full text-center py-12">
        <p class="text-gray-500">No investment plans available at the moment.</p>
      </div>
    `;
          return;
        }

        container.innerHTML = plans
          .map((plan) => {
            const isActive = plan.isActiveForUser;
            const expiry = plan.expiryDate
              ? new Date(plan.expiryDate).toLocaleDateString()
              : null;

            return `
      <div class="welfare-card">
        <div class="welfare-header">
          <h3 class="text-xl font-bold">${plan.title}</h3>
          <p class="text-sm opacity-90">${plan.description || ""}</p>
        </div>
        <div class="p-6 flex-grow">
          <div class="text-center mb-6">
            <span class="welfare-price">₦${Number(
              plan.price
            ).toLocaleString()}</span>
            <p class="text-gray-500 text-sm">One-time investment</p>
          </div>
          
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Daily Income:</span>
              <span class="font-semibold">₦${Number(
                plan.dailyIncome
              ).toLocaleString()}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Duration:</span>
              <span class="font-semibold">${plan.durationDays} days</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Total Returns:</span>
              <span class="font-semibold text-blue-5">₦${Number(
                plan.totalIncome
              ).toLocaleString()}</span>
            </div>
          </div>
        </div>
        <div class="p-4 border-t border-gray-100">
          ${
            isActive
              ? `<button class="btn-primary w-full py-3 rounded-lg font-semibold text-white cursor-not-allowed" disabled>
                   Active until ${expiry}
                 </button>`
              : `<button class="btn-primary w-full py-3 rounded-lg text-white font-semibold flex items-center justify-center invest-btn" data-plan="${plan._id}">
                   <span>Invest Now</span>
                   <i class="fas fa-arrow-right ml-2"></i>
                 </button>`
          }
        </div>
      </div>
    `;
          })
          .join("");
      }

      async function fetchInvestments() {
        const container = document.getElementById("investment-container");
        container.innerHTML = `
      <div class="col-span-full text-center py-12">
        <div class="loading-spinner mb-4"></div>
        <p>Loading investment plans...</p>
      </div>
    `;

        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/plans?planType=investment",
            {
              credentials: "include",
            }
          );

          if (!res.ok) throw new Error("Failed to fetch investment plans");

          const data = await res.json();
          generateInvestmentCards(data.data || []);
        } catch (err) {
          console.error("Error fetching investment plans:", err);
          container.innerHTML = `
        <div class="col-span-full text-center py-12">
          <p class="text-red-500">Failed to load investment plans. Please try again later.</p>
        </div>
      `;
        }
      }

      // Initial load
      document.addEventListener("DOMContentLoaded", () => {
        fetchInvestments();

        document.addEventListener("click", async function (e) {
          if (
            e.target.classList.contains("invest-btn") ||
            e.target.closest(".invest-btn")
          ) {
            const button = e.target.classList.contains("invest-btn")
              ? e.target
              : e.target.closest(".invest-btn");
            const planId = button.getAttribute("data-plan");

            if (!planId) return;

            // Add loading state
            button.disabled = true;
            const originalText = button.innerHTML;
            button.innerHTML = `    <div class="small-loading-spinner mr-2"></div>
 Processing...`;

            try {
              const res = await authFetch(
                "https://neo-invest-server.onrender.com/api/plans/buy",
                {
                  method: "POST",
                  credentials: "include", // send cookies
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ planId }),
                }
              );

              const data = await res.json();
              if (!res.ok)
                throw new Error(data.message || "Failed to buy plan");
              showToast({
                icon: "fas fa-check-circle",
                message: "Investment successful!",
                type: "success",
              });
            } catch (err) {
              console.error("Buy plan error:", err);
              showToast({
                icon: "fas fa-times-circle",
                message: err.message,
                type: "error",
              });
            } finally {
              // Restore button
              button.disabled = false;
              button.innerHTML = originalText;
            }
          }
        });
      });
    </script>
  </body>
</html>
