<!doctype html>
<html lang="en">
<head>
  <script src="./api-config.js"></script>
  <script src="./loader.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Blockvextrade</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
<script src="./toast.js"></script>
<style>
body { font-family: "Poppins", sans-serif; }
.gradient-bg { background: #00ff00; }
.input {
  background: #000000;
  border-radius: 12px;
  padding: 12px 16px;
  width: 100%;
  border: 1px solid #e5e7eb;
  outline: none;
  font-size: 14px;
  transition: border-color 0.2s;
  font-family: "Poppins", sans-serif;
}
.input:focus { border-color: #00ff00; }
.btn-gradient { background: #00ff00; }
</style>

  <script src="./translator.js"></script>
  <link rel="stylesheet" href="./global.css">
</head>

<body class="flex flex-col min-h-screen">

<!-- HEADER -->
<div class="gradient-bg text-white text-center py-16">
  <h1 class="text-base font-semibold">Blockvextrade</h1>
</div>

<!-- MAIN -->
<div class="flex justify-center px-4">
  <div class="bg-black border border-[#00ff00] w-full p-6">

    <!-- Back -->
    <a href="/otp.html" class="flex items-center gap-2 text-gray-400 text-xs mb-6">
      <i class="fas fa-chevron-left text-xs"></i>
      Back
    </a>

    <!-- Title -->
    <h2 class="text-xs font-semibold text-center mb-2">Reset Password</h2>
    <p class="text-xs text-gray-500 text-center mb-6">
      Create a strong new password for your account
    </p>

    <!-- FORM -->
    <form class="space-y-5" onsubmit="handleReset(event)">

      <!-- New Password -->
      <div>
        <label class="text-xs text-gray-500">New Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            id="rpNewPassword"
            class="input pr-10"
            placeholder="Enter new password"
            oninput="clearErr('rpNewPassword')"
          />
          <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"></i>
        </div>
        <p class="text-red-500 text-[11px] mt-1 hidden" id="rpNewPasswordErr"></p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-xs text-gray-500">Confirm Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            id="rpConfirmPassword"
            class="input pr-10"
            placeholder="Repeat new password"
            oninput="clearErr('rpConfirmPassword')"
          />
          <i class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"></i>
        </div>
        <p class="text-red-500 text-[11px] mt-1 hidden" id="rpConfirmPasswordErr"></p>
      </div>

      <!-- Button -->
      <button
        type="submit"
        id="rpBtn"
        class="w-full py-3 rounded-xl btn-gradient text-black font-extrabold flex items-center justify-center gap-2"
      >
        <span id="rpBtnText">Reset Password</span>
        <i class="fas fa-spinner fa-spin hidden" id="rpSpinner"></i>
      </button>

    </form>

    <!-- Back to login -->
    <div class="text-center mt-6 text-xs">
      <a href="/login.html" class="text-blue-500 cursor-pointer">
        Back to Login
      </a>
    </div>

  </div>
</div>


<script>
const API_BASE = window.API_BASE || "http://localhost:5000";

function showErr(id, msg) {
  const input = document.getElementById(id);
  const errEl = document.getElementById(id + 'Err');
  if (input) { input.style.borderColor = '#ef4444'; }
  if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
}

function clearErr(id) {
  const input = document.getElementById(id);
  const errEl = document.getElementById(id + 'Err');
  if (input) input.style.borderColor = '';
  if (errEl) errEl.classList.add('hidden');
}

function showToast(msg, type = 'success') {
  window.pToast({ message: msg, type: type });
}

function setLoading(on) {
  const btn = document.getElementById('rpBtn');
  const btnText = document.getElementById('rpBtnText');
  const spinner = document.getElementById('rpSpinner');
  if (!btn) return;
  btn.disabled = on;
  if (on) {
    if (btnText) btnText.textContent = '';
    if (spinner) spinner.classList.remove('hidden');
  } else {
    if (btnText) btnText.textContent = 'Reset Password';
    if (spinner) spinner.classList.add('hidden');
  }
}

async function handleReset(e) {
  e.preventDefault();

  const password    = document.getElementById('rpNewPassword').value.trim();
  const confirmPwd  = document.getElementById('rpConfirmPassword').value.trim();
  let hasError      = false;

  if (!password || password.length < 6) {
    showErr('rpNewPassword', password ? 'Password must be at least 6 characters' : 'New password is required');
    hasError = true;
  }
  if (!confirmPwd) {
    showErr('rpConfirmPassword', 'Please confirm your password');
    hasError = true;
  } else if (password !== confirmPwd) {
    showErr('rpConfirmPassword', 'Passwords do not match');
    hasError = true;
  }
  if (hasError) return;

  const phone      = sessionStorage.getItem('resetPhone') || '';
  const otp        = sessionStorage.getItem('verifiedOtp') || '';
  const resetToken = sessionStorage.getItem('resetToken') || '';

  if (!phone || !otp) {
    showToast('Session expired. Please start over.', 'error');
    setTimeout(() => window.location.href = '/forgotPassword.html', 1500);
    return;
  }

  setLoading(true);
  try {
    const payload = { phoneNumber: phone, otp, password };
    if (resetToken) payload.resetToken = resetToken;

    const res  = await fetch(`${API_BASE}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      // Clear session
      sessionStorage.removeItem('resetPhone');
      sessionStorage.removeItem('verifiedOtp');
      sessionStorage.removeItem('resetToken');
      showToast('Password reset successfully! Please log in.', 'success');
      setTimeout(() => window.location.href = '/login.html', 1500);
    } else {
      showToast(data.message || 'Reset failed. Please try again.', 'error');
    }
  } catch (err) {
    showToast('Network error. Please check your connection.', 'error');
  } finally {
    setLoading(false);
  }
}

// Password toggle
document.querySelectorAll('.toggle-password').forEach(icon => {
  icon.addEventListener('click', () => {
    const input = icon.previousElementSibling;
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
  });
});
</script>

</body>
</html>
