<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Globalstakeai</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

<style>
body {
  font-family: "Poppins", sans-serif;
}

.gradient-bg {
  background: linear-gradient(135deg, #4f8cff, #6ee7ff);
}

.input {
  background: #f8fafc;
  border-radius: 12px;
  padding: 12px 16px;
  width: 100%;
  border: 1px solid #e5e7eb;
}

.btn-gradient {
  background: linear-gradient(90deg, #5eead4, #93c5fd);
}
</style>
</head>

<body class="flex flex-col min-h-screen">

<!-- HEADER -->
<div class="gradient-bg text-white text-center py-16">
  <h1 class="text-xl font-semibold">Globalstakeai</h1>
</div>

<!-- MAIN -->
<div class=" flex justify-center px-4">
  <div class="bg-white w-full p-6 ">

    <!-- Title -->
    <h2 class="text-lg font-semibold text-center mb-2">
      Reset Password
    </h2>
    <p class="text-sm text-gray-500 text-center mb-6">
      Create a new password for your account
    </p>

    <!-- FORM -->
    <form class="space-y-5">

      <!-- New Password -->
      <div>
        <label class="text-sm text-gray-500">New Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            class="input pr-10"
            placeholder="Enter new password"
          />
          <i
            class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"
          ></i>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-sm text-gray-500">Confirm Password</label>
        <div class="relative mt-1">
          <input
            type="password"
            class="input pr-10"
            placeholder="Repeat new password"
          />
          <i
            class="fas fa-eye absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer toggle-password"
          ></i>
        </div>
      </div>

      <!-- Button -->
      <button
        class="w-full py-3 rounded-xl btn-gradient text-white font-semibold"
      >
        Reset Password
      </button>

    </form>

    <!-- Back -->
    <div class="text-center mt-6 text-sm">
      <a href="/login.html" class="text-blue-500 cursor-pointer">
        Back to Login
      </a>
    </div>

  </div>
</div>

<script>
// Toggle password visibility
document.querySelectorAll(".toggle-password").forEach((icon) => {
  icon.addEventListener("click", () => {
    const input = icon.previousElementSibling;

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  });
});
</script>

</body>
</html>
