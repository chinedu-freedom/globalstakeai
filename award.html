<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./api-config.js"></script>
  <script src="./loader.js"></script>
  <script src="./protect.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <title>Task Center - Blockvextrade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #000000 !important;
      color: #ffffff;
      padding-bottom: 40px;
    }

    .gradient-header {
      background: #00ff00;
    }

    .task-card {
      background: #0a0f0c !important;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      border: 1.5px solid rgba(0, 255, 0, 0.25) !important;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .task-card:hover {
      border-color: #00ff00 !important;
      box-shadow: 0 4px 25px rgba(0, 255, 0, 0.18);
      transform: translateY(-2px);
    }

    .reward-badge {
      background: rgba(0, 255, 0, 0.12) !important;
      color: #00ff00 !important;
      border: 1px solid rgba(0, 255, 0, 0.35);
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.15);
    }

    .claim-btn {
      transition: all 0.3s ease;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .claim-btn:disabled {
      background: #121c15 !important;
      color: #55705d !important;
      border: 1px solid rgba(0, 255, 0, 0.15);
      cursor: not-allowed;
    }

    .claim-btn.active {
      background: #00ff00 !important;
      color: #000000 !important;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
      cursor: pointer;
    }

    .claim-btn.active:hover {
      background: #00e000 !important;
      transform: scale(1.01);
    }
    
    .progress-bar-bg {
      background-color: #162219;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 0, 0.15);
    }
    
    .progress-bar-fill {
      height: 100%;
      background: #00ff00;
      border-radius: 999px;
      box-shadow: 0 0 10px #00ff00;
      transition: width 0.5s ease;
    }
  </style>
  <script src="./translator.js"></script>
  <script src="./toast.js"></script>
  <link rel="stylesheet" href="./global.css">
</head>
<body class="bg-[#000000] text-white">

  <div class="w-full max-w-md mx-auto bg-[#000000] min-h-screen relative shadow-2xl border-x border-[#00ff00]/20 flex flex-col">

    <!-- HEADER -->
    <div class="gradient-header px-6 pt-10 pb-16 flex items-center gap-4 text-black rounded-b-[40px] shadow-[0_0_25px_rgba(0,255,0,0.3)] relative z-0">
      <a href="javascript:history.back()" class="w-10 h-10 flex items-center justify-center bg-black/15 rounded-full hover:bg-black/25 text-black transition cursor-pointer">
        <i class="fas fa-chevron-left text-sm"></i>
      </a>
      <div>
        <h1 class="text-xl font-extrabold text-black">Task Center</h1>
        <p class="text-black/80 text-[11px] font-semibold mt-0.5">Invite active users to earn extra rewards</p>
      </div>
      <div class="absolute right-6 top-8 text-black/15 transform rotate-12 pointer-events-none">
          <i class="fas fa-trophy text-6xl"></i>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="px-4 -mt-10 relative z-10 flex-1">
      
      <!-- USER STATS SUMMARY -->
      <div class="bg-[#0a0f0c] border border-[#00ff00] rounded-2xl p-5 shadow-[0_0_20px_rgba(0,255,0,0.12)] mb-6 flex justify-between items-center">
          <div>
              <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-1">Active Referrals</p>
              <div class="flex items-baseline gap-2">
                  <span id="activeCount" class="text-3xl font-black text-white">0</span>
                  <span class="text-gray-400 text-xs font-semibold">People</span>
              </div>
          </div>
          <div class="h-12 w-[1px] bg-[#00ff00]/25"></div>
          <div class="text-right">
              <p class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-1">Bonus Potential</p>
              <p id="potentialBonus" class="text-xl font-black text-[#00ff00]">$130.00</p>
          </div>
      </div>

      <h2 class="text-white font-extrabold text-sm mb-4 px-1">Available Rewards</h2>

      <!-- TASK LIST -->
      <div id="taskList" class="space-y-4">
          <!-- skeleton loaders -->
          <div class="animate-pulse bg-[#0a0f0c] border border-[#00ff00]/30 h-36 rounded-2xl mb-4"></div>
          <div class="animate-pulse bg-[#0a0f0c] border border-[#00ff00]/30 h-36 rounded-2xl mb-4"></div>
          <div class="animate-pulse bg-[#0a0f0c] border border-[#00ff00]/30 h-36 rounded-2xl mb-4"></div>
      </div>

    </div>

  </div>

  <script>
    const TASKS = [
      { threshold: 15, reward: 5 },
      { threshold: 25, reward: 10 },
      { threshold: 35, reward: 15 },
      { threshold: 45, reward: 20 },
      { threshold: 55, reward: 30 },
      { threshold: 100, reward: 50 }
    ];

    document.addEventListener("DOMContentLoaded", async () => {
      await initAwardPage();
    });

    async function initAwardPage() {
      try {
        const res = await fetch(`${window.API_BASE || "https://api.blockvextrade.com"}/api/users/referrals?level=1`, { 
            credentials: 'include' 
        });
        
        if (!res.ok) {
            if (res.status === 401) window.location.href = 'login.html';
            throw new Error("Failed to fetch referrals");
        }

        const data = await res.json();
        const referrals = data.data?.referrals || [];
        
        const activeCount = referrals.filter(ref => (ref.totalInvested && ref.totalInvested > 0) || ref.accountStatus === 'active').length;
        
        document.getElementById("activeCount").innerText = activeCount;
        renderTasks(activeCount);
        
      } catch (error) {
        console.error(error);
        renderTasks(0);
      }
    }

    function renderTasks(count) {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";

      TASKS.forEach(task => {
        const progress = Math.min(count, task.threshold);
        const percent = (progress / task.threshold) * 100;
        const isCompleted = count >= task.threshold;

        const card = document.createElement("div");
        card.className = "task-card";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <div>
              <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Invitation Reward</p>
              <h3 class="text-[14px] font-extrabold text-white">Invite ${task.threshold} Active Users</h3>
            </div>
            <div class="reward-badge">
              $${task.reward.toFixed(2)}
            </div>
          </div>
          
          <div class="space-y-3">
              <div class="flex justify-between items-end mb-1">
                  <span class="text-[10.5px] font-semibold text-gray-400">Progress: <strong class="text-white">${progress}</strong>/${task.threshold}</span>
                  <span class="text-[10.5px] font-extrabold ${isCompleted ? 'text-[#00ff00]' : 'text-gray-400'}">${percent.toFixed(0)}%</span>
              </div>
              <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${percent}%"></div>
              </div>
          </div>

          <button 
            onclick="claimReward(${task.threshold}, ${task.reward}, ${isCompleted})" 
            class="claim-btn w-full mt-5 py-3 rounded-xl text-xs uppercase ${isCompleted ? 'active' : ''}" 
            ${!isCompleted ? 'disabled' : ''}
          >
            ${isCompleted ? 'Claim Reward' : 'Not Completed'}
          </button>
        `;
        taskList.appendChild(card);
      });
    }

    function claimReward(threshold, amount, isCompleted) {
      if (!isCompleted) return;
      
      window.pToast({ 
          message: `Claiming reward for ${threshold} invites...`, 
          type: "info",
          duration: 2000
      });

      setTimeout(() => {
          window.pToast({ 
              message: `Bonus of $${amount} submitted! Our team will credit your wallet upon verification.`, 
              type: "success",
              duration: 4000
          });
      }, 1500);
    }
  </script>
</body>
</html>
