<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./loader.js"></script>

  <script src="./protect.js"></script>
  <script src="./translator.js"></script>
  <script src="./toast.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Staking Plans - SatrixNow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8;
      padding-bottom: 70px;
      overflow-x: hidden;
      width: 100%;
    }
    
    body.modal-open {
      overflow: hidden;
      padding-right: var(--scrollbar-width, 0px);
    }

    .gradient-bg {
      background: linear-gradient(135deg, #4f8cff, #6ee7ff);
    }
    
    .btn-gradient {
      background: linear-gradient(90deg, #14b8a6, #2563eb);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      opacity: 0.9;
      box-shadow: 0 4px 12px rgba(94, 234, 212, 0.4);
    }

    /* Gradient text for plan name */
    .gradient-text {
      background: linear-gradient(90deg, #14b8a6, #2563eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .plan-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid #e5e7eb;
    }
    .plan-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-color: #93c5fd;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 50;
      border-top: 1px solid #f1f5f9;
      height: 64px;
    }

    .nav-item svg { width: 20px; height: 20px; margin-bottom: 4px; stroke-width: 2; }
    .nav-item span { font-size: 10px; font-weight: 500; }

    /* Modal - No layout shift */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0);
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
      visibility: hidden;
      pointer-events: none;
    }
    
    .modal-overlay.active {
      background: rgba(0, 0, 0, 0.6);
      visibility: visible;
      pointer-events: auto;
    }
    
    .modal-container {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 20rem;
      position: relative;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3);
    }
    
    .modal-overlay.active .modal-container {
      opacity: 1;
      transform: scale(1);
    }
    
    .amount-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: #1f2937;
      background-color: #f9fafb;
      transition: all 0.2s ease;
    }
    
    .amount-input:focus {
      outline: none;
      border-color: #4f8cff;
      background-color: white;
      box-shadow: 0 0 0 2px rgba(79, 140, 255, 0.1);
    }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    
    .detail-label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }
    
    .detail-value {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
    }

    /* Loading skeleton animation */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Hide elements during loading */
    .hidden-content {
      display: none;
    }
  </style>
</head>
<body>

  <div class="w-full max-w-md bg-[#f0f4f8] min-h-screen relative shadow-2xl mx-auto border-x border-gray-100">

    <!-- HEADER -->
    <div class="gradient-bg text-white px-5 pt-5 pb-8 rounded-b-[30px] shadow-md relative z-10">
      <div class="flex items-center mb-1">
        <a href="javascript:history.back()" class="text-white text-sm mr-4">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-base sm:text-sm font-bold leading-tight tracking-wide">Available Staking Plans</h1>
      </div>
    </div>

    <!-- PLANS CONTENT -->
    <div id="plansContainer" class="px-3 pb-3 mt-3 relative z-20 space-y-3">
        <div class="py-20 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#4f8cff] mx-auto mb-4"></div>
            <p class="text-gray-400 font-medium text-xs">Fetching investment plans...</p>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="w-full max-w-[28rem] mx-auto flex justify-around items-center h-full pt-1">
        <a href="/index.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="text-[8px] font-medium">Home</span>
        </a>
        <a href="/plans.html" class="nav-item flex flex-col items-center w-1/4 text-[#4f8cff] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M14.531 12.469 6.619 20.381l-4-4 7.912-7.912" /><path d="M15.686 11.314c.839.839 2.158.888 3.037.125l2.313-2.313a2.673 2.673 0 0 0 0-3.776L18.65 3.015a2.673 2.673 0 0 0-3.776 0L12.56 5.33c-.763.879-.714 2.198.125 3.037Z" /></svg>
          <span class="text-[8px] font-medium">Staking Plans</span>
        </a>
        <a href="/teams.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[8px] font-medium">Team</span>
        </a>
        <a href="/account.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[8px] font-medium">Account</span>
        </a>
      </div>
    </div>
  </div>

  <!-- ===== MODAL WITH LOADING SKELETON ===== -->
  <div id="stakeModal" class="modal-overlay">
    <div class="modal-container">
      
      <div class="p-5">
        <!-- Loading Skeleton (visible initially) -->
        <div id="loadingSkeleton">
          <div class="skeleton" style="height: 28px; width: 60%; margin: 0 auto 12px;"></div>
          <div class="detail-row">
            <span class="detail-label">Daily Return</span>
            <div class="skeleton" style="width: 60px; height: 20px;"></div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Minimum Entry:</span>
            <div class="skeleton" style="width: 80px; height: 20px;"></div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Maximum Entry:</span>
            <div class="skeleton" style="width: 80px; height: 20px;"></div>
          </div>
          <div class="detail-row">
            <span class="detail-label">Cycle duration:</span>
            <div class="skeleton" style="width: 60px; height: 20px;"></div>
          </div>
        </div>

        <!-- Actual Content (hidden initially) -->
        <div id="actualContent" style="display: none;">
          <!-- Plan Name with Gradient Color -->
          <h2 id="modalPlanName" class="text-base font-bold text-center gradient-text"></h2>
          
          <!-- Plan Details List -->
          <div class="mb-4">
            <div class="detail-row">
              <span class="detail-label">Daily Return</span>
              <div>
                <span class="detail-value" id="modalRate"></span><span class="text-xs">%</span>
              </div>
            </div>
            <div class="detail-row">
              <span class="detail-label">Minimum Entry:</span>
              <span class="detail-value" id="minEntry"></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Maximum Entry:</span>
              <span class="detail-value" id="maxEntry"></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Cycle duration:</span>
              <span class="detail-value" id="cycleDays"></span>
            </div>
            <!-- Added Balance Display -->
            <div class="detail-row mt-2 pt-2 border-t border-gray-50">
              <span class="detail-label text-[#4f8cff]">Available Balance:</span>
              <span class="detail-value text-[#4f8cff]" id="modalBalance">$0.00</span>
            </div>
          </div>

          <!-- Amount Input -->
          <div id="amountSection">
            <div class="mb-4">
              <label class="text-xs font-semibold text-gray-700 mb-1 block">Enter Amount</label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-500">$</span>
                <input
                  id="stakeAmountInput"
                  type="number"
                  placeholder="0"
                  class="amount-input pl-6"
                />
              </div>
              <p id="amountHint" class="text-[10px] text-gray-400 mt-1">Min: $0 | Max: Unlimited</p>
            </div>
          </div>
          
          <!-- Error Message -->
          <p id="stakeError" class="text-[11px] text-red-500 font-medium mb-3 hidden text-center"></p>

          <!-- Stake Now Button -->
          <button id="stakeConfirmBtn" onclick="confirmStake()" class="w-full btn-gradient text-white py-3 rounded-xl font-bold text-xs shadow-lg active:scale-95 transition-transform">
            Stake Now
          </button>
        </div>

        <!-- Cancel Button (always visible) -->
        <button onclick="closeStakeModal()" class="w-full text-center text-[11px] text-gray-400 font-medium mt-3 py-1 hover:text-gray-600 transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentPlan = {};
    let allPlans = [];
    let userBalance = 0;

    // Store scrollbar width to prevent shift
    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--scrollbar-width', scrollbarWidth + 'px');

    document.addEventListener("DOMContentLoaded", () => {
        fetchInvestmentPlans();
    });

    async function fetchInvestmentPlans() {
        try {
            const response = await fetch('https://satrixnow-server.onrender.com/api/investment/plans', {
                credentials: 'include'
            });

            if (response.status === 401 || response.status === 403) {
                window.location.href = '/login.html';
                return;
            }

            if (response.ok || response.status === 304) {
                const totalData = await response.json();
                allPlans = (totalData.data && totalData.data.plans) ? totalData.data.plans : 
                          (totalData.data && Array.isArray(totalData.data)) ? totalData.data :
                          (totalData.plans) ? totalData.plans : [];
                renderPlans(allPlans);
            } else {
                throw new Error(`Server returned ${response.status}`);
            }
        } catch (error) {
            console.error("Error fetching plans:", error);
            document.getElementById('plansContainer').innerHTML = `
                <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-gray-100 italic text-gray-400 text-xs">
                   <i class="fas fa-exclamation-triangle text-lg mb-2 block"></i>
                   Unable to load plans. Please try again later.
                </div>
            `;
        }
    }

    function renderPlans(plans) {
        const container = document.getElementById('plansContainer');
        if (!container) return;

        if (!plans || plans.length === 0) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-gray-100 italic text-gray-400 text-xs">
                   No staking plans available currently.
                </div>
            `;
            return;
        }

        container.innerHTML = plans.map((plan, idx) => {
            const isFD = plan.isFixedDeposit || false;
            const title = plan.title || "Investment Plan";
            const badgeText = isFD ? 'FIXED DEPOSIT' : 'HOT DEALS';
            
            const iconMap = [
                {bg: 'bg-blue-50', text: 'text-[#4f8cff]', icon: 'fa-layer-group'},
                {bg: 'bg-teal-50', text: 'text-teal-500', icon: 'fa-award'},
                {bg: 'bg-blue-100', text: 'text-[#4f8cff]', icon: 'fa-crown'},
                {bg: 'bg-yellow-50', text: 'text-yellow-500', icon: 'fa-gem'}
            ];
            const style = iconMap[idx % iconMap.length];

            const min = Number(plan.minDeposit || 0);
            const max = plan.maxDeposit ? Number(plan.maxDeposit) : null;
            const roi = Number(plan.dailyProfit || 0);
            const duration = Number(plan.contractDuration || 30);

            return `
              <div class="plan-card bg-white rounded-xl p-3 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 ${isFD ? 'bg-[#fef08a] text-yellow-800' : 'bg-orange-100 text-orange-600'} text-[8px] font-bold px-2 py-0.5 rounded-bl-md">
                  ${badgeText}
                </div>
                <div class="flex justify-between items-start border-b border-gray-50 pb-2 mb-2">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full ${style.bg} flex items-center justify-center ${style.text}">
                      <i class="fas ${style.icon} text-xs"></i>
                    </div>
                    <div>
                      <h3 class="font-bold text-gray-800 text-xs">${title}</h3>
                      <span class="bg-gray-50 text-gray-400 text-[9px] px-1.5 py-0.5 rounded font-medium">Daily Return</span>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="text-sm font-bold text-[#4f8cff]">${roi.toFixed(1)}%</p>
                  </div>
                </div>
                <div class="space-y-1.5 text-[11px] text-gray-600 mb-3">
                  <div class="flex justify-between">
                    <span>Minimum Entry:</span>
                    <span class="font-semibold text-gray-800">$${min.toLocaleString()}</span>
                  </div>
                  <div class="flex justify-between">
                    <span>Maximum Entry:</span>
                    <span class="font-semibold text-gray-800">${max ? '$' + max.toLocaleString() : 'Unlimited'}</span>
                  </div>
                  <div class="flex justify-between">
                    <span>Cycle duration:</span>
                    <span class="font-semibold text-gray-800">${duration} Days</span>
                  </div>
                </div>
                <button onclick="handleStakeClick('${plan._id || plan.id}')" class="w-full btn-gradient text-white py-2 rounded-lg font-bold shadow-sm text-xs active:scale-95 transition-transform flex items-center justify-center gap-2">
                  <i class="fas fa-coins text-xs"></i>
                  <span>Stake Now</span>
                </button>
              </div>
            `;
        }).join('');
    }

    window.handleStakeClick = async function(planId) {
        console.log("Clicked Stake Now. Plan ID:", planId);
        
        if (!planId) {
            console.error("No planId provided.");
            return;
        }

        // Reset modal - show loading skeleton
        document.getElementById('loadingSkeleton').style.display = 'block';
        document.getElementById('actualContent').style.display = 'none';
        
        openStakeModal();

        // parallel fetch plan and user data
        try {
            const [planRes, userRes] = await Promise.all([
                fetch(`https://satrixnow-server.onrender.com/api/investment/plans/${planId}`, {
                    credentials: 'include'
                }),
                fetch('https://satrixnow-server.onrender.com/api/users/me', {
                    credentials: 'include'
                })
            ]);

            if (planRes.status === 401 || userRes.status === 401) {
                window.location.href = '/login.html';
                return;
            }

            if (planRes.ok && userRes.ok) {
                const planResult = await planRes.json();
                const userResult = await userRes.json();
                
                const plan = planResult.data?.plan || planResult.data || planResult;
                const user = userResult.data || userResult;
                
                // Check both accountBalance (main balance) and currentAssets (stats fallback)
                userBalance = Number(user.accountBalance !== undefined ? user.accountBalance : (user.currentAssets || 0));
                document.getElementById('modalBalance').textContent = `$${userBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                const title = plan.title || "Investment Plan";
                const min = Number(plan.minDeposit || 0);
                const max = plan.maxDeposit ? Number(plan.maxDeposit) : null;
                const roi = Number(plan.dailyProfit || 0);
                const days = Number(plan.contractDuration || 30);

                currentPlan = {
                    id: planId,
                    name: title,
                    rate: roi,
                    min: min,
                    max: max,
                    days: days
                };

                // Populate actual content
                document.getElementById('modalPlanName').innerHTML = `<span class="gradient-text">${title}</span>`;
                document.getElementById('modalRate').textContent = roi.toFixed(1);
                document.getElementById('minEntry').textContent = `$${min.toLocaleString()}`;
                document.getElementById('maxEntry').textContent = max ? `$${max.toLocaleString()}` : 'Unlimited';
                document.getElementById('cycleDays').textContent = `${days} Days`;
                document.getElementById('amountHint').innerHTML = `Min: $${min.toLocaleString()} | Max: ${max ? '$' + max.toLocaleString() : 'Unlimited'}`;
                
                // Reset input and error
                document.getElementById('stakeAmountInput').value = '';
                document.getElementById('stakeError').classList.add('hidden');
                
                // Hide skeleton, show actual content
                document.getElementById('loadingSkeleton').style.display = 'none';
                document.getElementById('actualContent').style.display = 'block';
                
            } else {
                console.error("Fetch failed with status:", response.status);
                window.pToast({ message: "Failed to fetch plan details. Please try again.", type: "error" });
                setTimeout(() => closeStakeModal(), 2000);
            }
        } catch (err) {
            console.error("Fetch Error:", err);
            window.pToast({ message: "Network error. Try again.", type: "error" });
            setTimeout(() => closeStakeModal(), 2000);
        }
    }

    function showModalError(message) {
        const errorEl = document.getElementById('stakeError');
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
    }

    function openStakeModal() {
        const modal = document.getElementById('stakeModal');
        document.body.classList.add('modal-open');
        modal.classList.add('active');
    }

    function closeStakeModal() {
        const modal = document.getElementById('stakeModal');
        modal.classList.remove('active');
        document.body.classList.remove('modal-open');
        setTimeout(() => {
            currentPlan = {};
            // Reset to skeleton view for next time
            document.getElementById('loadingSkeleton').style.display = 'block';
            document.getElementById('actualContent').style.display = 'none';
        }, 300);
    }

    window.confirmStake = async function() {
        const amount = parseFloat(document.getElementById('stakeAmountInput').value);
        const errorEl = document.getElementById('stakeError');
        const btn = document.getElementById('stakeConfirmBtn');
        errorEl.classList.add('hidden');

        if (!currentPlan.name) {
            showModalError('Please select a valid plan first.');
            return;
        }

        if (!amount || amount <= 0) {
            showModalError('Please enter a valid investment amount.');
            return;
        }
        
        if (amount < currentPlan.min) {
            showModalError(`Minimum investment is $${currentPlan.min.toLocaleString()}.`);
            return;
        }
        
        if (currentPlan.max && amount > currentPlan.max) {
            showModalError(`Maximum investment is $${currentPlan.max.toLocaleString()}.`);
            return;
        }

        // --- SMART LOGIC ---
        if (amount > userBalance) {
            // Insufficient balance -> Redirect to deposit with pre-fill
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Redirecting to Deposit...';
            btn.disabled = true;
            setTimeout(() => {
                window.location.href = `deposit.html?plan=${encodeURIComponent(currentPlan.name)}&amount=${amount}&planId=${currentPlan.id}`;
            }, 1000);
            return;
        }

        // Sufficient balance -> Direct Stake
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Staking...';
        btn.disabled = true;

        try {
            const res = await fetch('https://satrixnow-server.onrender.com/api/users/investments', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    planId: currentPlan.id,
                    amount: amount
                })
            });

            const data = await res.json();

            if (res.ok) {
                window.pToast({ message: "Investment started successfully!", type: "success" });
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Success!';
                btn.style.background = "#10b981";
                setTimeout(() => {
                    closeStakeModal();
                    window.location.href = '/miner.html';
                }, 1500);
            } else {
                showModalError(data.message || "Staking failed. Please try again.");
                btn.innerHTML = 'Stake Now';
                btn.disabled = false;
            }
        } catch (err) {
            console.error("Staking error:", err);
            window.pToast({ message: "Network error occurred.", type: "error" });
            btn.innerHTML = 'Stake Now';
            btn.disabled = false;
        }
    }

    // Close modal on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('stakeModal');
            if (modal.classList.contains('active')) {
                closeStakeModal();
            }
        }
    });
  </script>
</body>
</html>
