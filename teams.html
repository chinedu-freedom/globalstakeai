<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./loader.js"></script>

  <script src="./protect.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>My Team - StakeWiseAi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8;
      padding-bottom: 70px; 
    }

    .gradient-bg {
      background: linear-gradient(135deg, #4f8cff, #6ee7ff);
    }
    
    .btn-gradient {
      background: linear-gradient(90deg, #5eead4, #93c5fd);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      opacity: 0.9;
      box-shadow: 0 4px 12px rgba(94, 234, 212, 0.4);
    }

    .stat-card {
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .stat-card:hover {
      border-color: #93c5fd;
      transform: translateY(-2px);
    }

    .member-card {
      background: white;
      border-radius: 20px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      transition: transform 0.2s ease;
    }
    .member-card:hover { transform: translateY(-2px); }
    .member-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #14b8a6, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .level-tab {
      transition: all 0.3s ease;
    }
    .level-tab.active {
      background: linear-gradient(135deg, #4f8cff, #6ee7ff);
      color: white;
      font-weight: 600;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 50;
      border-top: 1px solid #f1f5f9;
      height: 64px;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
  </style>

  <script src="./translator.js"></script>
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md mx-auto border-x border-gray-100 bg-[#f0f4f8] min-h-screen relative shadow-xl">

    <!-- HEADER -->
    <div class="gradient-bg text-white pt-5 pb-10 px-5 rounded-b-[40px] shadow-md relative">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-base font-semibold">My Team</h1>
        <div>
          <i class="fas fa-users text-lg text-white/80"></i>
        </div>
      </div>
      
      <!-- <div class="text-center mt-2">
        <p class="text-xs text-white/80">Total Invites</p>
        <p class="text-base font-bold mt-1">0</p>
      </div> -->
    </div>

    <!-- REFERRAL LINK AREA -->
    <div class="px-3 -mt-10 relative z-10 w-full mb-6">
      <div class="w-full rounded-2xl p-5 bg-white shadow-lg border border-gray-100">
        <p class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">My Referral Link</p>
        <div class="flex bg-gray-50 rounded-xl overflow-hidden border border-gray-200">
          <input type="text" id="referralCode" class="w-full bg-transparent p-3 text-gray-700 text-xs outline-none" value="" placeholder="Fetching referral link..." readonly />
          <button onclick="copyLink()" class="btn-gradient text-white px-5 font-semibold text-xs">
            Copy
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-3 text-center">Share this link to earn up to 25% commissions</p>
      </div>
    </div>

    <!-- TEAM STATS -->
    <div class="px-3 mb-6">
      <h3 class="text-xs font-semibold text-gray-800 mb-3 px-1">Team Overview</h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="stat-card shadow-sm">
          <p class="text-gray-500 text-xs mb-1">Total Invites</p>
          <p class="text-base font-bold text-gray-800" id="totalInvites">0</p>
        </div>
        <div class="stat-card shadow-sm">
          <p class="text-gray-500 text-xs mb-1">Total Earnings</p>
          <p class="text-base font-bold text-[#4f8cff]" id="totalEarnings">$0.00</p>
        </div>
      </div>
    </div>

    <!-- LEVELS -->
    <div class="px-3 mb-6">
      <div class="flex bg-gray-100 rounded-full p-1 mb-4 border border-gray-200">
        <button class="level-tab active flex-1 py-2 text-xs rounded-full text-gray-600" onclick="switchLevel(this, 1)">Level 1 (10%)</button>
        <button class="level-tab flex-1 py-2 text-xs rounded-full text-gray-600" onclick="switchLevel(this, 2)">Level 2 (5%)</button>
        <button class="level-tab flex-1 py-2 text-xs rounded-full text-gray-600" onclick="switchLevel(this, 3)">Level 3 (1%)</button>
      </div>

      <!-- MEMBER LIST: Level panels -->
      <div id="level-1" class="level-panel space-y-3">
        <!-- Dynmically loaded -->
        <div class="py-10 text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#4f8cff] mx-auto mb-3"></div>
            <p class="text-xs text-gray-400">Fetching team...</p>
        </div>
      </div>

      <div id="level-2" class="level-panel space-y-3 hidden">
          <!-- Dynmically loaded -->
      </div>

      <div id="level-3" class="level-panel space-y-3 hidden">
          <!-- Dynmically loaded -->
      </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-10 right-1/2 translate-x-1/2 bg-[#4f8cff] text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
      Link Copied successfully!
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="w-full max-w-[28rem] mx-auto flex justify-around items-center h-full pt-1">
        <a href="/index.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_home">Home</span>
        </a>
        <a href="/plans.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M14.531 12.469 6.619 20.381l-4-4 7.912-7.912" /><path d="M15.686 11.314c.839.839 2.158.888 3.037.125l2.313-2.313a2.673 2.673 0 0 0 0-3.776L18.65 3.015a2.673 2.673 0 0 0-3.776 0L12.56 5.33c-.763.879-.714 2.198.125 3.037Z" /></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_staking">Staking Plans</span>
        </a>
        <a href="/teams.html" class="nav-item flex flex-col items-center w-1/4 text-[#4f8cff] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_team">Team</span>
        </a>
        <a href="/account.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_account">Account</span>
        </a>
      </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>

  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchReferralData();
        fetchUserDataForLink();
        fetchReferralConfig();
    });

    async function fetchReferralConfig() {
        try {
            const res = await fetch('https://stakewiseai-server.onrender.com/api/users/referral-config');
            if (res.ok) {
                const data = await res.json();
                const config = data.data || data;
                
                // Update button labels
                const tabs = document.querySelectorAll('.level-tab');
                if (tabs.length >= 3) {
                    tabs[0].innerHTML = `Level 1 (${config.level1}%)`;
                    tabs[1].innerHTML = `Level 2 (${config.level2}%)`;
                    tabs[2].innerHTML = `Level 3 (${config.level3}%)`;
                }

                // Update "earn up to" text
                const totalMax = Number(config.level1) + Number(config.level2) + Number(config.level3);
                const earnText = document.querySelector('.px-3.-mt-10 p.text-xs.text-gray-400');
                if (earnText) {
                    earnText.innerText = `Share this link to earn up to ${totalMax}% commissions`;
                }
            }
        } catch (e) { console.error("Error fetching referral config:", e); }
    }

    async function fetchUserDataForLink() {
        try {
            const res = await fetch('https://stakewiseai-server.onrender.com/api/users/me', { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                const user = data.user || data.data || data;
                if (user && (user._id || user.id)) {
                    const id = user._id || user.id;
                    const link = `https://stakewiseai.vip/login.html?ref=${id}`;
                    document.getElementById("referralCode").value = link;
                }
            }
        } catch (e) { console.error(e); }
    }

    async function fetchReferralData() {
        try {
            const p1 = fetch('https://stakewiseai-server.onrender.com/api/users/referrals?level=1', { credentials: 'include' });
            const p2 = fetch('https://stakewiseai-server.onrender.com/api/users/referrals?level=2', { credentials: 'include' });
            const p3 = fetch('https://stakewiseai-server.onrender.com/api/users/referrals?level=3', { credentials: 'include' });
            const pMe = fetch('https://stakewiseai-server.onrender.com/api/users/me', { credentials: 'include' });

            const [res1, res2, res3, resMe] = await Promise.all([p1, p2, p3, pMe]);
            
            if (res1.status === 401 || res1.status === 403) {
                window.location.href = '/login.html';
                return;
            }

            let totalInvites = 0;

            if (resMe.ok) {
                const meData = await resMe.json();
                const userObj = meData.user || meData.data || meData;
                if (userObj.totalReferralEarnings !== undefined) {
                    document.getElementById("totalEarnings").innerText = `$${Number(userObj.totalReferralEarnings).toFixed(2)}`;
                }
            }

            if (res1.ok) {
                const d1 = await res1.json();
                const members1 = d1.data?.referrals || [];
                totalInvites += d1.data?.pagination?.totalItems || members1.length || 0;
                renderLevel(1, members1);
            }
            if (res2.ok) {
                const d2 = await res2.json();
                const members2 = d2.data?.referrals || [];
                totalInvites += d2.data?.pagination?.totalItems || members2.length || 0;
                renderLevel(2, members2);
            }
            if (res3.ok) {
                const d3 = await res3.json();
                const members3 = d3.data?.referrals || [];
                totalInvites += d3.data?.pagination?.totalItems || members3.length || 0;
                renderLevel(3, members3);
            }

            document.getElementById("totalInvites").innerText = totalInvites;

        } catch (error) {
            console.error("Error fetching referrals:", error);
        }
    }

    function renderLevel(levelNum, members) {
        const container = document.getElementById(`level-${levelNum}`);
        if (!container) return;

        if (!members || members.length === 0) {
            container.innerHTML = `
                <div class="py-12 text-center bg-white rounded-2xl border border-dashed border-gray-200">
                    <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-user-friends text-gray-300"></i>
                    </div>
                    <p class="text-xs text-gray-400">No referrals at Level ${levelNum} yet</p>
                </div>
            `;
            return;
        }

        container.innerHTML = members.map(m => {
            const name = m.username || "Investor";
            const initial = name.charAt(0).toUpperCase();
            const dateStr = m._createdAt || m.createdAt;
            const date = dateStr ? new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : "Recently";
            const status = m.accountStatus || "active";
            
            // Note: If invested amount isn't in this specific referral object, we show 0 or status
            const invested = m.totalInvested !== undefined ? `$${Number(m.totalInvested).toFixed(2)}` : (status.charAt(0).toUpperCase() + status.slice(1));

            return `
                <div class="member-card">
                  <div class="member-avatar">${initial}</div>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold text-gray-800">${name}</p>
                    <p class="text-[10px] text-gray-400">Joined ${date}</p>
                  </div>
                  <div class="text-right flex-shrink-0">
                    <p class="text-xs font-bold text-[#4f8cff]">${invested}</p>
                    <p class="text-[9px] text-gray-400">${m.totalInvested !== undefined ? 'Invested' : 'Status'}</p>
                  </div>
                </div>
            `;
        }).join('');
    }

    function copyLink() {
      const copyText = document.getElementById("referralCode");
      copyText.select();
      copyText.setSelectionRange(0, 99999); 
      navigator.clipboard.writeText(copyText.value);
      
      const toast = document.getElementById("toast");
      toast.classList.remove("opacity-0");
      setTimeout(() => {
        toast.classList.add("opacity-0");
      }, 2000);
    }

    function switchLevel(element, level) {
      document.querySelectorAll('.level-tab').forEach(el => {
        el.classList.remove('active');
        el.classList.add('text-gray-600');
      });
      element.classList.add('active');
      element.classList.remove('text-gray-600');

      document.querySelectorAll('.level-panel').forEach(panel => panel.classList.add('hidden'));
      const activePanel = document.getElementById('level-' + level);
      if (activePanel) activePanel.classList.remove('hidden');
    }
  </script>
</body>
</html>
