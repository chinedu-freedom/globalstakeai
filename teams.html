<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>My Team - StakeWiseAi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8;
      padding-bottom: 70px; 
    }

    .gradient-bg {
      background: linear-gradient(135deg, #4f8cff, #6ee7ff);
    }
    
    .btn-gradient {
      background: linear-gradient(90deg, #5eead4, #93c5fd);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      opacity: 0.9;
      box-shadow: 0 4px 12px rgba(94, 234, 212, 0.4);
    }

    .stat-card {
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .stat-card:hover {
      border-color: #93c5fd;
      transform: translateY(-2px);
    }

    .level-tab {
      transition: all 0.3s ease;
    }
    .level-tab.active {
      background: linear-gradient(135deg, #4f8cff, #6ee7ff);
      color: white;
      font-weight: 600;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 50;
      border-top: 1px solid #f1f5f9;
      height: 64px;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
  </style>

  <script src="./translator.js"></script>
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md mx-auto border-x border-gray-100 bg-[#f0f4f8] min-h-screen relative shadow-xl">

    <!-- HEADER -->
    <div class="gradient-bg text-white pt-5 pb-8 px-5 rounded-b-[40px] shadow-md relative">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-base font-semibold">My Team</h1>
        <div>
          <i class="fas fa-users text-2xl text-white/80"></i>
        </div>
      </div>
      
      <div class="text-center mt-2">
        <p class="text-xs text-white/80">Total Team Bonus</p>
        <p class="text-xl font-bold mt-1">₦0.00</p>
      </div>
    </div>

    <!-- REFERRAL LINK AREA -->
    <div class="px-3 -mt-10 relative z-10 w-full mb-6">
      <div class="w-full rounded-2xl p-5 bg-white shadow-lg border border-gray-100">
        <p class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">My Referral Link</p>
        <div class="flex bg-gray-50 rounded-xl overflow-hidden border border-gray-200">
          <input type="text" id="referralCode" class="w-full bg-transparent p-3 text-gray-700 text-sm outline-none" value="https://StakeWiseAi.com/register?r=08158051119" readonly />
          <button onclick="copyLink()" class="btn-gradient text-white px-5 font-semibold text-sm">
            Copy
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-3 text-center">Share this link to earn up to 25% commissions</p>
      </div>
    </div>

    <!-- TEAM STATS -->
    <div class="px-3 mb-6">
      <h3 class="text-xs font-semibold text-gray-800 mb-3 px-1">Team Overview</h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="stat-card shadow-sm">
          <p class="text-gray-500 text-xs mb-1">Total Team Size</p>
          <p class="text-base font-bold text-gray-800">0</p>
        </div>
        <div class="stat-card shadow-sm">
          <p class="text-gray-500 text-xs mb-1">Active Members</p>
          <p class="text-base font-bold text-[#4f8cff]">0</p>
        </div>
      </div>
    </div>

    <!-- LEVELS -->
    <div class="px-3 mb-6">
      <div class="flex bg-gray-100 rounded-full p-1 mb-4 border border-gray-200">
        <button class="level-tab active flex-1 py-2 text-sm rounded-full text-gray-600" onclick="switchLevel(this, 1)">Level 1 (25%)</button>
        <button class="level-tab flex-1 py-2 text-sm rounded-full text-gray-600" onclick="switchLevel(this, 2)">Level 2 (2%)</button>
        <button class="level-tab flex-1 py-2 text-sm rounded-full text-gray-600" onclick="switchLevel(this, 3)">Level 3 (1%)</button>
      </div>

      <!-- MEMBER LIST START -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 min-h-[150px] flex flex-col items-center justify-center">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-3">
          <i class="fas fa-folder-open text-gray-300 text-2xl"></i>
        </div>
        <p class="text-gray-400 text-sm">No members found in this level</p>
      </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-10 right-1/2 translate-x-1/2 bg-[#4f8cff] text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
      Link Copied successfully!
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="w-full max-w-[28rem] mx-auto flex justify-around items-center h-full pt-1">
        <a href="/index.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_home">Home</span>
        </a>
        <a href="/plans.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M14.531 12.469 6.619 20.381l-4-4 7.912-7.912" /><path d="M15.686 11.314c.839.839 2.158.888 3.037.125l2.313-2.313a2.673 2.673 0 0 0 0-3.776L18.65 3.015a2.673 2.673 0 0 0-3.776 0L12.56 5.33c-.763.879-.714 2.198.125 3.037Z" /></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_staking">Staking Plans</span>
        </a>
        <a href="/teams.html" class="nav-item flex flex-col items-center w-1/4 text-[#4f8cff] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_team">Team</span>
        </a>
        <a href="/account.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_account">Account</span>
        </a>
      </div>
    </div>
    </div>
    </div>
    </div>
    </div>

  </div>
  <script>
    function copyLink() {
      const copyText = document.getElementById("referralCode");
      copyText.select();
      copyText.setSelectionRange(0, 99999); 
      navigator.clipboard.writeText(copyText.value);
      
      const toast = document.getElementById("toast");
      toast.classList.remove("opacity-0");
      setTimeout(() => {
        toast.classList.add("opacity-0");
      }, 2000);
    }

    function switchLevel(element, level) {
      document.querySelectorAll('.level-tab').forEach(el => {
        el.classList.remove('active');
        el.classList.add('text-gray-600');
      });
      element.classList.add('active');
      element.classList.remove('text-gray-600');
      
      // We would swap list contents here normally
    }
  </script>
</body>
</html>
