  <script>
    async function handleLogout() {
      const btn       = document.getElementById('logoutBtn');
      const icon      = document.getElementById('logoutIcon');
      const spinner   = document.getElementById('logoutSpinner');
      const label     = document.getElementById('logoutLabel');

      // Show loading state
      btn.disabled    = true;
      icon.classList.add('hidden');
      spinner.classList.remove('hidden');
      label.textContent = 'Logging out...';

      try {
        const res = await fetch('https://stakewiseai-server.onrender.com/api/auth/logout', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' }
        });

        if (res.ok || res.status === 200 || res.status === 204) {
          // Clear local storage on successful logout
          localStorage.clear();
          sessionStorage.clear();
          // Redirect to login
          window.location.href = '/login.html';
        } else {
          throw new Error('Logout failed with status ' + res.status);
        }
      } catch (err) {
        console.error('Logout error:', err);
        window.pToast({ message: 'Logout failed. Please try again.', type: 'error' });
        // Restore button
        btn.disabled = false;
        icon.classList.remove('hidden');
        spinner.classList.add('hidden');
        label.textContent = 'Logout';
      }
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        // const storedPhone = localStorage.getItem("userPhone");
        // if(storedPhone) {
        //     document.getElementById("userPhoneDisplay").innerText = storedPhone;
        // }

        // LOAD SAVED AVATAR
        const savedAvatar = localStorage.getItem("userAvatar");
        if(savedAvatar) {
            const avatarEl = document.getElementById("profileAvatar");
            const skeletonContainer = document.getElementById("avatarSkeletonContainer");
            if (avatarEl) {
                avatarEl.onload = () => {
                    avatarEl.classList.remove('hidden');
                    if (skeletonContainer) skeletonContainer.classList.remove('animate-pulse');
                };
                avatarEl.src = savedAvatar;
            }
        }

        // 1. Fetch User Data
        try {
            const userRes = await fetch('https://stakewiseai-server.onrender.com/api/users/me', {
                credentials: 'include'
            });
            if (userRes.status === 401 || userRes.status === 403) {
                window.location.href = '/login.html';
                return;
            }
            if (userRes.ok) {
                const userData = await userRes.json();
                const user = userData.data || userData;
                if (user) {
                    const idEl = document.getElementById("userIdDisplay");
                    const phoneEl = document.getElementById("userPhoneDisplay");
                    const copyIcon = document.getElementById("copyIdIcon");

                    if (user._id || user.id) {
                        idEl.innerText = `ID: ${user._id || user.id}`;
                        idEl.classList.remove('animate-pulse', 'bg-white/20', 'h-4', 'w-24', 'rounded-md');
                        if (copyIcon) copyIcon.classList.remove('hidden');
                    }
                    if (user.phoneNumber || user.phone) {
                        phoneEl.innerText = user.phoneNumber || user.phone;
         ~               phoneEl.classList.remove('animate-pulse', 'bg-white/20', 'h-3', 'w-32', 'rounded-md', 'mt-1.5');
                        phoneEl.classList.add('mt-0.5'); // Restore original margin
                        localStorage.setItem("userPhone", user.phoneNumber || user.phone);
                    }
                    const skeletonContainer = document.getElementById("avatarSkeletonContainer");
                    const initialsEl = document.getElementById("profileInitials");
                    const avatarEl = document.getElementById("profileAvatar");
                    
                    const setInitialsFallback = () => {
                        if (skeletonContainer) {
                            skeletonContainer.classList.remove('animate-pulse', 'bg-gray-200');
                            skeletonContainer.classList.add('bg-[#1fa2d0]'); 
                            if (initialsEl && user.username) {
                                const initials = user.username.substring(0, 2).toUpperCase();
                                initialsEl.innerText = initials;
                                initialsEl.classList.remove('hidden');
                            }
                        }
                    };

                    if (user.image && user.image.asset && user.image.asset._ref) {
                        const ref = user.image.asset._ref;
                        const parts = ref.split('-'); 
                        if (parts.length === 4) {
                            const assetId = parts[1];
                            const dimensions = parts[2];
                            const extension = parts[3];
                            const projectId = "hr3iao8d";
                            const dataset = "production"; 
                            const imageUrl = `https://cdn.sanity.io/images/${projectId}/${dataset}/${assetId}-${dimensions}.${extension}`;
                            
                            if (avatarEl) {
                                avatarEl.onload = () => {
                                    avatarEl.classList.remove('hidden');
                                    if (skeletonContainer) skeletonContainer.classList.remove('animate-pulse');
                                    if (initialsEl) initialsEl.classList.add('hidden');
                                };
                                avatarEl.onerror = () => setInitialsFallback();
                                avatarEl.src = imageUrl;
                            }
                            localStorage.setItem('userAvatar', imageUrl);
                        } else {
                             setInitialsFallback();
                        }
                    } else if (user.profilePicture) {
                        if (avatarEl) {
                            avatarEl.onload = () => {
                                avatarEl.classList.remove('hidden');
                                if (skeletonContainer) skeletonContainer.classList.remove('animate-pulse');
                                if (initialsEl) initialsEl.classList.add('hidden');
                            };
                            avatarEl.onerror = () => setInitialsFallback();
                            avatarEl.src = user.profilePicture;
                        }
                        localStorage.setItem('userAvatar', user.profilePicture);
                    } else {
                        setInitialsFallback();
                    }
                    if (user.vipLevel) {
                        const vipEl = document.querySelector('a[href="/vip.html"]');
                        if (vipEl) vipEl.innerText = user.vipLevel;
                    }
                }
            }
        } catch (error) {
            console.error("Error fetching user data:", error);
        }

        // 2. Fetch Dashboard Stats
        try {
            const statsRes = await fetch('https://stakewiseai-server.onrender.com/api/users/dashboard-stats', {
                credentials: 'include'
            });
            if (statsRes.ok) {
                const statsData = await statsRes.json();
                const stats = statsData.data || statsData;
                
                if (stats.totalStaked !== undefined) {
                    document.getElementById("statTotalStaked").innerText = `$${Number(stats.totalStaked).toFixed(2)}`;
                }
                // Use accountBalance from user object if currentAssets from stats is 0 or missing
                const resolvedAssets = stats.currentAssets || user.accountBalance || 0;
                if (document.getElementById("statCurrentAssets")) {
                    document.getElementById("statCurrentAssets").innerText = `$${Number(resolvedAssets).toFixed(2)}`;
                }
                if (stats.commission !== undefined) {
                    document.getElementById("statCommission").innerText = `$${Number(stats.commission).toFixed(2)}`;
                }
            }
        } catch (error) {
            console.error("Error fetching dashboard stats:", error);
        }
    });

    async function updateAvatar(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
          const base64Image = e.target.result;
          
          const avatarEl = document.getElementById('profileAvatar');
          const skeletonContainer = document.getElementById('avatarSkeletonContainer');
          const initials = document.getElementById('profileInitials');
          
          if (avatarEl) {
              avatarEl.src = base64Image;
              avatarEl.classList.remove('hidden');
          }
          if (skeletonContainer) skeletonContainer.classList.remove('animate-pulse', 'bg-[#1fa2d0]');
          if (initials) initials.classList.add('hidden');
          
          localStorage.setItem('userAvatar', base64Image);

          window.pToast({ message: "Uploading picture...", type: "info", duration: 2000 });

          try {
            // Because the expected payload might vary, we can try `multipart/form-data` first,
            // or alternatively submit base64 directly if the backend supports it.
            const formData = new FormData();
            formData.append('image', file);

            // Attempt formData:
            let response = await fetch('https://stakewiseai-server.onrender.com/api/users/me', {
                method: 'PATCH',
                credentials: 'include',
                body: formData
            });

            if (response.status === 401 || response.status === 403) {
                window.location.href = '/login.html';
                return;
            }

            // If it fails due to payload format, try raw JSON with base64
            if (!response.ok && response.status === 400) {
                response = await fetch('https://stakewiseai-server.onrender.com/api/users/me', {
                    method: 'PATCH',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });
            }

            if (response.ok) {
                window.pToast({ message: "Profile picture updated!", type: "success" });
            } else {
                const errData = await response.json().catch(() => ({}));
                window.pToast({ message: errData.message || "Failed to update picture", type: "error" });
            }
          } catch (err) {
            console.error("Upload error:", err);
            window.showToast({ message: "Error uploading picture", type: "error" });
          }
        };
        
        reader.readAsDataURL(file);
      }
    }

    function copyId() {
      const idText = document.getElementById("userIdDisplay").innerText.replace('ID: ', '');
      navigator.clipboard.writeText(idText);
      window.pToast({ message: "ID copied successfully!", type: "success" });
    }
  </script>
