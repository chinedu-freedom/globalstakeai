  <script>
    // Logic to fetch stored session info if available
    document.addEventListener("DOMContentLoaded", () => {
        const storedPhone = localStorage.getItem("userPhone");
        if(storedPhone) {
            document.getElementById("userPhoneDisplay").innerText = "+234 " + storedPhone;
        }

        // LOAD SAVED AVATAR
        const savedAvatar = localStorage.getItem("userAvatar");
        if(savedAvatar) {
            document.getElementById("profileAvatar").src = savedAvatar;
        }
    });

    function updateAvatar(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Image = e.target.result;
          // Update UI
          document.getElementById('profileAvatar').src = base64Image;
          // Save to LocalStorage
          localStorage.setItem('userAvatar', base64Image);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function copyId() {
      const idText = document.getElementById("userIdDisplay").innerText.replace('ID: ', '');
      navigator.clipboard.writeText(idText);
      
      const toast = document.getElementById("toast");
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2000);
    }
  </script>
