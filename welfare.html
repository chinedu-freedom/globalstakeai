<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Welfare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
              },
              teal: {
                500: "#14b8a6",
                600: "#0d9488",
              },
            },
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              roboto: ["Roboto", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .welfare-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .welfare-card:hover {
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
        transform: translateY(-5px);
      }
      .welfare-header {
        background: #3b82f6;
        color: white;
        padding: 16px;
        text-align: center;
      }
      .welfare-price {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0ea5e9;
      }
      .btn-primary {
        background: #3b82f6;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      }
      .loading-spinner {
        border: 3px solid #f9f8f8;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      .small-loading-spinner {
        border: 3px solid #f9f8f8;
        border-top: 3px solid #0ea5e9;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @media (min-width: 768px) {
        body {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body style="display: none" class="font-poppins">
    <div class="lg:p-4 space-y-8 max-w-4xl mx-auto">
      <div id="header" class="sticky top-0 z-[1000]"></div>
      <div class="px-4 lg:px-0">
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16"
          id="welfare-container"
        ></div>
      </div>
      <div id="footer" class="fixed w-full md:sticky bottom-0 z-[1000]"></div>
    </div>

    <script type="module">
      import { showToast } from "./toast.js";
      import { authFetch, checkAuth } from "./auth.js";
      import { protectPage } from "./protect.js";

      function waitForHeaderUI() {
        return new Promise((resolve) => {
          const interval = setInterval(() => {
            if (typeof window.updateHeaderUI === "function") {
              clearInterval(interval);
              resolve();
            }
          }, 100);
        });
      }

      checkAuth().then(async (user) => {
        if (user) {
          document.body.style.display = "block";
          protectPage();
          await waitForHeaderUI();
          fetchUserDetails();
        } else {
          window.location.href = "/login.html";
        }
      });

      async function fetchUserDetails() {
        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/users/me",
            { credentials: "include" }
          );
          if (!res.ok) throw new Error("Failed to fetch user details");
          const userData = await res.json();
          if (typeof window.updateHeaderUI === "function") {
            updateHeaderUI(userData);
          }
        } catch (err) {
          console.error("Error fetching user details:", err);
        }
      }
      function generateWelfareCards(plans) {
        const container = document.getElementById("welfare-container");
        if (!plans || plans.length === 0) {
          container.innerHTML = `
      <div class="col-span-full text-center py-12">
        <p class="text-gray-500">No welfare plans available right now.</p>
      </div>
    `;
          return;
        }

        container.innerHTML = plans
          .map((plan) => {
            const isActive = plan.isActiveForUser;
            const expiry = plan.expiryDate
              ? new Date(plan.expiryDate).toLocaleDateString()
              : null;

            return `
      <div class="welfare-card">
        <div class="welfare-header">
          <h3 class="text-xl font-bold">${plan.title}</h3>
          <p class="text-sm opacity-90">${plan.description || ""}</p>
        </div>
        <div class="p-6 flex-grow">
          <div class="text-center mb-6">
            <span class="welfare-price">₦${Number(
              plan.price
            ).toLocaleString()}</span>
            <p class="text-gray-500 text-sm">One-time welfare plan</p>
          </div>
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Daily Income:</span>
              <span class="font-semibold">₦${Number(
                plan.dailyIncome
              ).toLocaleString()}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Duration:</span>
              <span class="font-semibold">${plan.durationDays} days</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600">Total Returns:</span>
              <span class="font-semibold text-blue-500">₦${Number(
                plan.totalIncome
              ).toLocaleString()}</span>
            </div>
          </div>
        </div>
        <div class="p-4 border-t border-gray-100">
          ${
            isActive
              ? `<button class="btn-primary w-full py-3 rounded-lg font-semibold text-white cursor-not-allowed" disabled>
                   Active until ${expiry}
                 </button>`
              : `<button class="btn-primary w-full py-3 rounded-lg text-white font-semibold flex items-center justify-center welfare-btn" data-plan="${plan._id}">
                   <span>Invest Now</span>
                   <i class="fas fa-arrow-right ml-2"></i>
                 </button>`
          }
        </div>
      </div>
    `;
          })
          .join("");
      }

      async function fetchWelfarePlans() {
        const container = document.getElementById("welfare-container");
        container.innerHTML = `
       <div class="flex flex-col items-center justify-center w-full h-full col-span-full">
    <div class="loading-spinner mb-2"></div>
    <p class="text-gray-500 font-medium">Loading welfare...</p>
  </div>
      `;

        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/plans?planType=welfare",
            {
              credentials: "include",
            }
          );
          if (!res.ok) throw new Error("Failed to fetch welfare plans");

          const data = await res.json();
          generateWelfareCards(data.data || []);
        } catch (err) {
          console.error("Error fetching welfare plans:", err);
          container.innerHTML = `
          <div class="col-span-full text-center py-12">
            <p class="text-red-500">Failed to load welfare plans. Try again later.</p>
          </div>
        `;
        }
      }

      document.addEventListener("click", async function (e) {
        if (
          e.target.classList.contains("welfare-btn") ||
          e.target.closest(".welfare-btn")
        ) {
          const button = e.target.classList.contains("welfare-btn")
            ? e.target
            : e.target.closest(".welfare-btn");
          const planId = button.getAttribute("data-plan");
          if (!planId) return;

          button.disabled = true;
          const originalText = button.innerHTML;
          button.innerHTML = `    <div class="small-loading-spinner mr-2"></div>
 Processing...`;

          try {
            const res = await authFetch(
              "https://neo-invest-server.onrender.com/api/plans/buy",
              {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ planId }),
              }
            );

            const data = await res.json();
            if (!res.ok) throw new Error(data.message || "Failed to buy plan");
            showToast({
              icon: "fas fa-check-circle",
              message: "Plan purchased successfully!",
              type: "success",
            });
            fetchUserDetails();
          } catch (err) {
            showToast({
              icon: "fas fa-exclamation-circle",
              message: err.message || "Something went wrong while buying plan",
              type: "error",
            });
          } finally {
            button.disabled = false;
            button.innerHTML = originalText;
          }
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        fetchWelfarePlans(); // fetch immediately on page load
        setInterval(fetchWelfarePlans, 10000);
      });
    </script>
  </body>
</html>
