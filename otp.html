<!doctype html>
<html lang="en">
<head>
  <script src="./api-config.js"></script>
  <script src="./loader.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Code - Blockvextrade</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
<script src="./toast.js"></script>
<style>
body { font-family: "Poppins", sans-serif; }
.gradient-bg { background: #00ff00; }
.btn-gradient { background: #00ff00; }

.otp-input {
  width: 46px;
  height: 54px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  border-radius: 12px;
  border: 1px solid #00ff00;
  background: #000000;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: monospace;
  color: #00ff00 !important;
}
.otp-input:focus {
  border-color: #00ff00;
  box-shadow: 0 0 0 2px rgba(0,255,0,0.3);
}
</style>

  <script src="./translator.js"></script>
  <link rel="stylesheet" href="./global.css">
</head>

<body class="flex flex-col min-h-screen bg-black">

<!-- HEADER -->
<div class="gradient-bg text-black text-center py-12">
  <div class="flex flex-col items-center">
    <div class="w-14 h-14 rounded-2xl overflow-hidden shadow-lg mb-2 border border-[#00ff00]/40 bg-black">
      <img src="./logo.jpeg" alt="Blockvextrade Logo" class="w-full h-full object-cover">
    </div>
    <h1 class="text-base font-bold tracking-wide text-black">Blockvextrade</h1>
  </div>
</div>

<!-- MAIN -->
<div class="flex-1 flex justify-center px-4 py-8">
  <div class="bg-black border border-[#00ff00] w-full max-w-md p-6 rounded-2xl shadow-xl h-fit">

    <!-- Back arrow -->
    <a href="/login.html" id="backLink" class="flex items-center gap-2 text-[#00ff00] text-xs mb-6 hover:underline">
      <i class="fas fa-chevron-left text-xs"></i>
      Back to Login
    </a>

    <!-- Title -->
    <h2 class="text-base font-bold text-center mb-2 text-white" id="otpTitle">Verify Code</h2>
    <p class="text-xs text-gray-400 text-center mb-1" id="otpSubtitle">
      Enter the 6-digit verification code sent to
    </p>
    <p class="text-sm text-[#00ff00] font-semibold text-center mb-6 break-all" id="otpTarget"></p>

    <!-- OTP FORM -->
    <form class="space-y-6" onsubmit="handleVerifyOtp(event)">

      <!-- OTP Inputs (6 digits) -->
      <div class="flex justify-center gap-2" id="otpInputsWrap">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
        <input type="text" inputmode="numeric" maxlength="1" class="otp-input" />
      </div>

      <!-- Button -->
      <button
        type="submit"
        id="otpBtn"
        class="w-full py-3 rounded-xl btn-gradient text-black font-bold flex items-center justify-center gap-2"
      >
        <span id="otpBtnText">Verify Email</span>
        <i class="fas fa-spinner fa-spin hidden" id="otpSpinner"></i>
      </button>

    </form>

    <!-- Resend -->
    <div class="text-center mt-6 text-xs">
      <span class="text-gray-400">Didn't receive the code?</span>
      <button id="resendBtn" class="text-[#00ff00] ml-1 font-bold hover:underline" onclick="handleResend()">Resend Code</button>
    </div>
    <p class="text-center text-gray-400 text-xs mt-2 hidden" id="resendCountdown"></p>

  </div>
</div>

<script>
const API_BASE = window.API_BASE || "https://api.blockvextrade.com";
const inputs   = document.querySelectorAll('.otp-input');

const urlParams = new URLSearchParams(window.location.search);
const flowType  = urlParams.get('type') || (sessionStorage.getItem('verifyEmail') ? 'verify-email' : 'reset');
const targetEmail = urlParams.get('email') || sessionStorage.getItem('verifyEmail') || '';
const resetPhone  = sessionStorage.getItem('resetPhone') || '';

document.addEventListener('DOMContentLoaded', () => {
  const titleEl = document.getElementById('otpTitle');
  const subEl   = document.getElementById('otpSubtitle');
  const targetEl = document.getElementById('otpTarget');
  const btnText  = document.getElementById('otpBtnText');
  const backLink = document.getElementById('backLink');

  if (flowType === 'verify-email') {
    titleEl.textContent = 'Verify Your Email';
    subEl.textContent = 'Enter the 6-digit code sent to your email:';
    targetEl.textContent = targetEmail || 'your email';
    btnText.textContent = 'Verify Email';
    backLink.href = '/login.html';
    backLink.innerHTML = '<i class="fas fa-chevron-left text-xs mr-1"></i> Back to Login';
  } else {
    titleEl.textContent = 'Reset Password OTP';
    subEl.textContent = 'Enter the verification code sent to:';
    targetEl.textContent = targetEmail || resetPhone || 'your contact';
    btnText.textContent = 'Verify Code';
    backLink.href = '/forgotPassword.html';
    backLink.innerHTML = '<i class="fas fa-chevron-left text-xs mr-1"></i> Back to Forgot Password';
  }

  if (inputs.length > 0) inputs[0].focus();
});

// --- OTP keyboard navigation ---
inputs.forEach((input, index) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '');
    if (input.value.length === 1 && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && input.value === '' && index > 0) {
      inputs[index - 1].focus();
    }
  });

  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    pasted.split('').forEach((char, i) => {
      if (inputs[i]) inputs[i].value = char;
    });
    const nextEmpty = [...inputs].findIndex(inp => !inp.value);
    if (nextEmpty !== -1) inputs[nextEmpty].focus();
    else inputs[inputs.length - 1].focus();
  });
});

function getOtpValue() {
  return [...inputs].map(i => i.value).join('');
}

function showOtpErr(msg) {
  showToast(msg, 'error');
}

function clearOtpErr() {
  // Toasts handle error display and dismissal
}

function showToast(msg, type = 'success') {
  window.pToast({ message: msg, type: type });
}

function setLoading(on) {
  const btn = document.getElementById('otpBtn');
  const btnText = document.getElementById('otpBtnText');
  const spinner = document.getElementById('otpSpinner');
  if (!btn) return;
  btn.disabled = on;
  if (on) {
    if (btnText) btnText.textContent = '';
    if (spinner) spinner.classList.remove('hidden');
  } else {
    if (btnText) btnText.textContent = (flowType === 'verify-email') ? 'Verify Email' : 'Verify Code';
    if (spinner) spinner.classList.add('hidden');
  }
}

async function handleVerifyOtp(e) {
  e.preventDefault();
  const otp = getOtpValue();

  if (otp.length < 6) {
    showToast('Please enter the complete 6-digit code', 'error');
    return;
  }

  setLoading(true);

  if (flowType === 'verify-email') {
    const email = targetEmail;
    if (!email) {
      showToast('Session expired. Please register or log in again.', 'error');
      setTimeout(() => window.location.href = '/login.html', 1500);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/verify-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });
      const data = await res.json();

      if (res.ok) {
        sessionStorage.removeItem('verifyEmail');
        showToast('Email verified successfully! You can now log in.', 'success');
        setTimeout(() => window.location.href = '/login.html', 1500);
      } else {
        showToast(data.message || 'Invalid or expired code. Please try again.', 'error');
      }
    } catch (err) {
      showToast('Network error. Please check your connection.', 'error');
    } finally {
      setLoading(false);
    }
  } else {
    // Password reset OTP verification
    const email = targetEmail || resetPhone;
    try {
      const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });
      const data = await res.json();

      if (res.ok) {
        if (data.resetToken) sessionStorage.setItem('resetToken', data.resetToken);
        sessionStorage.setItem('verifiedOtp', otp);
        showToast('Code verified! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/resetPassword.html', 1300);
      } else {
        showToast(data.message || 'Invalid code. Please try again.', 'error');
      }
    } catch (err) {
      showToast('Network error. Please check your connection.', 'error');
    } finally {
      setLoading(false);
    }
  }
}

// --- Resend OTP with 60s cooldown ---
let resendTimer = null;
async function handleResend() {
  const email = targetEmail || resetPhone;
  if (!email) return;

  const btn = document.getElementById('resendBtn');
  const countdown = document.getElementById('resendCountdown');
  btn.disabled = true;
  countdown.classList.remove('hidden');

  let seconds = 60;
  countdown.textContent = `Resend available in ${seconds}s`;
  resendTimer = setInterval(() => {
    seconds--;
    countdown.textContent = `Resend available in ${seconds}s`;
    if (seconds <= 0) {
      clearInterval(resendTimer);
      btn.disabled = false;
      countdown.classList.add('hidden');
    }
  }, 1000);

  const endpoint = flowType === 'verify-email'
    ? `${API_BASE}/api/auth/resend-verification`
    : `${API_BASE}/api/auth/request-otp`;

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('A new verification code has been sent!', 'success');
      inputs.forEach(inp => inp.value = '');
      inputs[0].focus();
    } else {
      showToast(data.message || 'Could not resend code.', 'error');
    }
  } catch {
    showToast('Network error.', 'error');
  }
}
</script>

</body>
</html>
