        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">

      <!-- Version -->

        <div class="flex items-center gap-3">

    </div>


    <!-- BOTTOM NAV -->

          <span class="text-[10px] font-medium translator" data-key="nav_staking">Staking Plans</span>

          <span class="text-[10px] font-medium translator" data-key="nav_team">Team</span>

        </a>

    </div>
    </div>
    </div>
    </div>

  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const user = localStorage.getItem("userName");
        if(user) {
            document.getElementById("settingUsername").innerText = user;
        }

        const isDark = localStorage.getItem('darkMode') === 'enabled';
        const toggle = document.getElementById('toggle');
        if(toggle) toggle.checked = isDark;

        // LOAD SAVED AVATAR
        const savedAvatar = localStorage.getItem("userAvatar");
        if(savedAvatar) {
            document.getElementById("settingAvatar").src = savedAvatar;
        }
    });

    function updateSettingAvatar(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Image = e.target.result;
          // Update UI
          document.getElementById('settingAvatar').src = base64Image;
          // Save to LocalStorage (Same key as account page for sync)
          localStorage.setItem('userAvatar', base64Image);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Modal behavior
    function togglePasswordModal(show) {
      const modal = document.getElementById('pwdModal');
      const modalContent = document.getElementById('pwdModalContent');
      const overlay = document.getElementById('pwdOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function toggleLanguageModal(show) {
      const modal = document.getElementById('langModal');
      const modalContent = document.getElementById('langModalContent');
      const overlay = document.getElementById('langOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function changeLanguage(langName, flagUrl) {
      if (window.setSiteLanguage) {
          window.setSiteLanguage(langName, flagUrl);
          return;
      }
      document.getElementById('activeLangText').innerText = langName;
      document.getElementById('activeLangFlag').src = flagUrl;
      toggleLanguageModal(false);
    }

    function toggleLanguageModal(show) {
      const modal = document.getElementById('langModal');
      const modalContent = document.getElementById('langModalContent');
      const overlay = document.getElementById('langOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300); // Wait for transition out
      }
    }

    function changeLanguage(langName, flagUrl) {
      if (window.setSiteLanguage) {
          window.setSiteLanguage(langName, flagUrl);
          return;
      }
      document.getElementById('activeLangText').innerText = langName;
      document.getElementById('activeLangFlag').src = flagUrl;
      toggleLanguageModal(false);
    }

    function toggleVisibility(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('i');
      if(input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function changePasswordSubmit() {
      alert("Password successfully updated (Placeholder)");
      togglePasswordModal(false);
    }
  </script>
</body>
