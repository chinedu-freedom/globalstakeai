    }
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }

    

    /* Hide Scrollbar */
    .overflow-y-auto::-webkit-scrollbar {
      display: none;
    }
    .overflow-y-auto {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

  <!-- ===== PASSWORD MODAL ===== -->
  <div id="pwdModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center px-5" onclick="if(event.target === this) togglePasswordModal(false)">
    <div id="pwdOverlay" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity duration-300" onclick="togglePasswordModal(false)"></div>
    <div id="pwdModalContent" class="relative w-full max-w-sm bg-white rounded-[32px] shadow-2xl scale-95 opacity-0 transition-all duration-300 max-h-[75vh] flex flex-col p-6" onclick="event.stopPropagation()">
      
      <h3 class="text-[15px] font-bold text-gray-800 text-center mb-6">Change Password</h3>

      <form id="pwdForm" autocomplete="off" onsubmit="event.preventDefault(); changePasswordSubmit();" class="space-y-4 mb-6">
        <div>
          <label class="block text-[11px] font-semibold text-gray-500 mb-1.5 ml-1">Current Password</label>
          <div class="relative flex items-center">
            <input type="password" id="currentPasswordInput" name="current_password_input" autocomplete="current-password" class="w-full bg-[#f0f4f8] border border-gray-100 text-gray-800 text-xs rounded-xl py-4 pl-4 pr-10 focus:outline-none focus:ring-1 focus:ring-blue-400 transition" placeholder="Enter current password">
            <button type="button" class="absolute right-4 text-gray-400 focus:outline-none" onclick="toggleVisibility(this)">
              <i class="far fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div>
           <label class="block text-[11px] font-semibold text-gray-500 mb-1.5 ml-1">New Password</label>
           <div class="relative flex items-center">
             <input type="password" id="newPasswordInput" name="new_password_input" autocomplete="new-password" class="w-full bg-[#f0f4f8] border border-gray-100 text-gray-800 text-xs rounded-xl py-4 pl-4 pr-10 focus:outline-none focus:ring-1 focus:ring-blue-400 transition" placeholder="Enter new password">
             <button type="button" class="absolute right-4 text-gray-400 focus:outline-none" onclick="toggleVisibility(this)">
               <i class="far fa-eye text-xs"></i>
             </button>
           </div>
        </div>

        <div>
           <label class="block text-[11px] font-semibold text-gray-500 mb-1.5 ml-1">Confirm New Password</label>
           <div class="relative flex items-center">
             <input type="password" id="confirmPasswordInput" name="confirm_password_input" autocomplete="new-password" class="w-full bg-[#f0f4f8] border border-gray-100 text-gray-800 text-xs rounded-xl py-4 pl-4 pr-10 focus:outline-none focus:ring-1 focus:ring-blue-400 transition" placeholder="Confirm new password">
             <button type="button" class="absolute right-4 text-gray-400 focus:outline-none" onclick="toggleVisibility(this)">
               <i class="far fa-eye text-xs"></i>
             </button>
           </div>
        </div>
      </form>
      <div class="flex flex-col gap-3">
        <button onclick="changePasswordSubmit()" id="changePwdBtn" class="w-full header-bg active:scale-[0.98] text-black font-extrabold py-4 rounded-xl text-xs transition shadow-sm">
          Save Changes
        </button>
      </div>

    </div>
  </div>

    <!-- MAIN CONTENT START -->

          <span id="verificationStatus" class="animate-pulse bg-gray-100 text-transparent text-[9px] font-bold px-4 py-0.5 rounded-full">Loading</span>

      <a href="javascript:void(0)" onclick="toggleLanguageModal(true)" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-50 flex items-center justify-between hover:bg-gray-50 transition cursor-pointer">
        <div class="flex items-center gap-3">

            <i class="fas fa-language text-[13px]"></i>

        <div class="flex items-center gap-2">

      <a href="javascript:void(0)" onclick="togglePasswordModal(true)" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-50 flex items-center justify-between hover:bg-gray-50 transition cursor-pointer">

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        // FETCH REAL DATA
        await fetchUserDetails();

        // Restore active language checkmark after page reload
        const reverseMapFull = {
          'en':'English','es':'Español','fr':'Français','de':'Deutsch',
          'it':'Italiano','pt':'Português','zh-CN':'中文','ja':'日本語',
          'ko':'한국어','ru':'Русский','hi':'हिन्दी','ar':'العربية',
          'tr':'Türkçe','nl':'Nederlands','id':'Bahasa Indonesia',
          'vi':'Tiếng Việt','th':'ไทย','el':'Ελληνικά','sv':'Svenska','pl':'Polski'
        };
        const savedGCode = localStorage.getItem('siteLangGCode');
        const activeLangName = reverseMapFull[savedGCode] || 'English';
        // Hide all checkmarks first
        document.querySelectorAll('[id^="check-"]').forEach(el => el.classList.add('hidden'));
        // Show the active one
        const activeCheck = document.getElementById('check-' + activeLangName);
        if (activeCheck) activeCheck.classList.remove('hidden');
    });

    async function fetchUserDetails() {
        try {
            const response = await fetch(`${window.API_BASE || "http://localhost:5000"}/api/users/me`, {
                credentials: 'include'
            });
            if (response.ok) {
                const data = await response.json();
                const user = data.user || data.data || data;
                
                if (user) {
                    const usernameEl = document.getElementById("settingUsername");
                    const emailEl = document.getElementById("settingEmail");
                    
                    usernameEl.innerText = user.username || "User";
                    usernameEl.classList.remove('animate-pulse', 'bg-gray-100', 'h-4', 'w-24', 'rounded-md', 'mb-1');
                    
                    emailEl.innerText = user.email || "";
                    emailEl.classList.remove('animate-pulse', 'bg-gray-100', 'h-3', 'w-36', 'rounded-md');

                    // Verification logic
                    const verifyEl = document.getElementById("verificationStatus");
                    verifyEl.classList.remove('animate-pulse', 'bg-gray-100', 'text-transparent');
                    if (user.emailVerified) {
                        verifyEl.innerText = "Verified";
                        verifyEl.classList.add('bg-green-100', 'text-green-700');
                        verifyEl.classList.remove('bg-[#fef3c7]', 'text-[#92400e]');
                    } else {
                        verifyEl.innerText = "Not Verified";
                        verifyEl.classList.add('bg-[#fef3c7]', 'text-[#92400e]');
                        verifyEl.classList.remove('bg-green-100', 'text-green-700');
                    }

                    // Avatar logic
                    const avatarImg = document.getElementById("settingAvatar");
                    const avatarContainer = document.getElementById("settingAvatarContainer");
                    avatarContainer.classList.remove('animate-pulse', 'bg-gray-100'); 

                    if (user.imageUrl) {
                        avatarImg.src = user.imageUrl;
                        avatarImg.classList.remove('hidden');
                        const existingFallback = avatarContainer.querySelector('.initials-fallback');
                        if (existingFallback) existingFallback.remove();
                        avatarImg.onerror = () => {
                            showInitialsFallback(user.username, avatarContainer, avatarImg);
                        };
                        localStorage.setItem('userAvatar', user.imageUrl);
                    } else if (user.image && user.image.asset && user.image.asset._ref) {
                        const ref = user.image.asset._ref;
                        const parts = ref.split('-');
                        const id = parts[1];
                        const dimensions = parts[2];
                        const format = parts[3];
                        const url = `https://cdn.sanity.io/images/doihcvcm/production/${id}-${dimensions}.${format}`;
                        
                        avatarImg.src = url;
                        avatarImg.classList.remove('hidden');
                        
                        const existingFallback = avatarContainer.querySelector('.initials-fallback');
                        if (existingFallback) existingFallback.remove();

                        avatarImg.onerror = () => {
                            showInitialsFallback(user.username, avatarContainer, avatarImg);
                        };
                    } else if (user.profilePicture) {
                        avatarImg.src = user.profilePicture;
                        avatarImg.classList.remove('hidden');
                        const existingFallback = avatarContainer.querySelector('.initials-fallback');
                        if (existingFallback) existingFallback.remove();
                    } else {
                        showInitialsFallback(user.username, avatarContainer, avatarImg);
                    }
                }
            } else if (response.status === 401 || response.status === 403) {
                window.location.href = '/login.html';
            }
        } catch (error) {
            console.error("Error fetching user details:", error);
        }
    }

    function showInitialsFallback(username, container, imgElement) {
        imgElement.classList.add('hidden');
        const initials = (username || "U").substring(0, 2).toUpperCase();
        
        // Remove existing fallback
        const old = container.querySelector('.initials-fallback');
        if (old) old.remove();

        const fallback = document.createElement('div');
        fallback.className = 'initials-fallback w-full h-full flex items-center justify-center bg-[#1fa2d0] text-white font-bold text-xs';
        fallback.innerText = initials;
        container.appendChild(fallback);
    }

    function filterLanguages(query) {
      const q = query.toLowerCase().trim();
      const buttons = document.querySelectorAll('#langList button[onclick^="changeLanguage"]');
      let visible = 0;
      buttons.forEach(btn => {
        const name = btn.querySelector('span').textContent.toLowerCase();
        const matches = name.includes(q);
        btn.style.display = matches ? '' : 'none';
        if (matches) visible++;
      });
      document.getElementById('langNoResults').classList.toggle('hidden', visible > 0);
    }

    async function updateSettingAvatar(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        
        if (file.size > 5 * 1024 * 1024) {
          if (window.pToast) window.pToast({ message: "Image size must be less than 5MB", type: "error" });
          return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
          const base64Image = e.target.result;
          
          const avatarImg = document.getElementById('settingAvatar');
          const container = document.getElementById('settingAvatarContainer');
          
          avatarImg.src = base64Image;
          avatarImg.classList.remove('hidden');
          const fallback = container.querySelector('.initials-fallback');
          if (fallback) fallback.remove();

          localStorage.setItem('userAvatar', base64Image);

          if (window.pToast) {
            window.pToast({ message: "Uploading profile picture...", type: "info", duration: 2500 });
          }

          // Live upload to backend
          try {
            const formData = new FormData();
            formData.append('image', file);
            
            const response = await fetch(`${window.API_BASE || "http://localhost:5000"}/api/users/me`, {
                method: 'PATCH',
                credentials: 'include',
                body: formData
            });

            if (response.status === 401 || response.status === 403) {
              window.location.href = '/login.html';
              return;
            }

            const data = await response.json().catch(() => ({}));
            if (response.ok) {
              const resolvedUrl = data.data?.imageUrl || data.imageUrl;
              if (resolvedUrl) {
                localStorage.setItem('userAvatar', resolvedUrl);
                avatarImg.src = resolvedUrl;
              }
              if (window.pToast) {
                window.pToast({ message: "Profile picture updated successfully!", type: "success" });
              }
            } else {
              if (window.pToast) {
                window.pToast({ message: data.message || "Failed to update profile picture", type: "error" });
              }
            }
          } catch (err) {
            console.error("Upload error", err);
            if (window.pToast) {
              window.pToast({ message: "Error uploading profile picture", type: "error" });
            }
          }
        };
        reader.readAsDataURL(file);
      }
    }

    // Modal behavior
    function togglePasswordModal(show) {
      const modal = document.getElementById('pwdModal');
      const modalContent = document.getElementById('pwdModalContent');
      const overlay = document.getElementById('pwdOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function toggleLanguageModal(show) {
      const modal = document.getElementById('langModal');
      const modalContent = document.getElementById('langModalContent');
      const overlay = document.getElementById('langOverlay');
      const searchInput = document.getElementById('langSearch');

      if(show) {
        if (searchInput) {
          searchInput.value = '';
          filterLanguages('');
        }
        modal.classList.remove('hidden');
        setTimeout(() => {
          if (searchInput) {
            searchInput.value = '';
            filterLanguages('');
          }
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function changeLanguage(langName, flagUrl) {
      if (window.setSiteLanguage) {
          window.setSiteLanguage(langName, flagUrl);
      }
      document.getElementById('activeLangText').innerText = langName;
      document.getElementById('activeLangFlag').src = flagUrl;

      // Update checkmarks
      document.querySelectorAll('[id^="check-"]').forEach(el => el.classList.add('hidden'));
      const checkEl = document.getElementById('check-' + langName);
      if (checkEl) checkEl.classList.remove('hidden');

      toggleLanguageModal(false);
    }

    function toggleVisibility(btn) {
      const input = btn.previousElementSibling;
      const icon = btn.querySelector('i');
      if(input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function changePasswordSubmit() {
      const currentPwd = document.getElementById('currentPasswordInput').value.trim();
      const newPwd = document.getElementById('newPasswordInput').value.trim();
      const confirmPwd = document.getElementById('confirmPasswordInput').value.trim();
      const btn = document.getElementById('changePwdBtn');


      if(!currentPwd || !newPwd || !confirmPwd) {
          window.pToast({ message: "Please fill out all fields", type: "warning" });
          return;
      }
      if(newPwd.length < 6) {
          window.pToast({ message: "New password must be at least 6 characters", type: "warning" });
          return;
      }
      if(newPwd !== confirmPwd) {
          window.pToast({ message: "New password and Confirm password do not match", type: "warning" });
          return;
      }

      const oldText = btn.innerText;
      btn.innerText = "Validating...";
      btn.disabled = true;

      try {
          const response = await fetch(`${window.API_BASE || "http://localhost:5000"}/api/users/change-password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({
                  currentPassword: currentPwd,
                  newPassword: confirmPwd
              })
          });

          const data = await response.json();
          if(response.ok || data.success) {
              window.pToast({ message: data.message || "Password successfully updated!", type: "success" });
              document.getElementById('currentPasswordInput').value = '';
              document.getElementById('newPasswordInput').value = '';
              document.getElementById('confirmPasswordInput').value = '';
              setTimeout(() => togglePasswordModal(false), 1500);
          } else {
              window.pToast({ message: data.message || "Failed to update password", type: "error" });
          }
      } catch (error) {
          window.pToast({ message: "A network error occurred. Please try again later.", type: "error" });
      } finally {
          btn.innerText = oldText;
          btn.disabled = false;
      }
    }
  </script>
