<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Dashboard Footer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              teal: {
                50: "#f0fdfa",
                100: "#ccfbf1",
                200: "#99f6e4",
                300: "#5eead4",
                400: "#2dd4bf",
                500: "#14b8a6",
                600: "#0d9488",
                700: "#0f766e",
                800: "#115e59",
                900: "#134e4a",
              },
            },
            fontFamily: {
              poppins: ["Poppins", "sans-serif"],
              roboto: ["Roboto", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f0f7ff 0%, #dbeafe 100%);
        min-height: 100vh;
      }

      .footer-icon-container {
        background: #3b82f6;
        border-radius: 12px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2px;
        transition: all 0.3s ease;
      }

      .footer-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        text-decoration: none;
      }

      .footer-item:hover .footer-icon-container {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(14, 165, 233, 0.3);
      }

      .footer-item:hover p {
        color: #0ea5e9;
      }
    </style>
  
  <script src="./translator.js"></script>
</head>

  <body class="flex items-center justify-center min-h-screen font-poppins">
    <footer class="w-full max-w-4xl">
      <div
        class="md:hidden bg-white flex justify-between items-center shadow-lg w-full py-3 px-4"
      >
        <a href="/index.html" class="footer-item">
          <div class="footer-icon-container">
            <i class="fas fa-home text-white text-sm" aria-hidden="true"></i>
          </div>
          <p class="text-xs font-medium text-gray-700 mt-1">Home</p>
        </a>

        <a href="https://wa.me/message/JHIUM4UB36FBK1" class="footer-item">
          <div class="footer-icon-container">
            <i class="fas fa-headset text-white text-sm" aria-hidden="true"></i>
          </div>
          <p class="text-xs font-medium text-gray-700 mt-1">Support</p>
        </a>

        <a href="/withdrawal.html" class="footer-item">
          <div class="footer-icon-container">
            <i
              class="fas fa-hand-holding-usd text-white text-sm"
              aria-hidden="true"
            ></i>
          </div>
          <p class="text-xs font-medium text-gray-700 mt-1">Cashout</p>
        </a>

        <button
          id="logoutBtn"
          type="button"
          class="footer-item bg-transparent border-none"
        >
          <div class="footer-icon-container">
            <i
              class="fas fa-sign-out-alt text-white text-sm"
              aria-hidden="true"
            ></i>
          </div>
          <p class="text-xs font-medium text-gray-700 mt-1">Logout</p>
        </button>
      </div>
    </footer>

    <script type="module">
      import { showToast } from "./toast.js";
      import { authFetch } from "./auth.js";

      const logoutButton = document.getElementById("logoutBtn");
      logoutButton.addEventListener("click", async () => {
        try {
          const res = await authFetch(
            "https://neo-invest-server.onrender.com/api/auth/logout",
            {
              method: "POST",
              credentials: "include",
            }
          );

          const data = await res.json();

          if (res.ok) {
            showToast({
              icon: "fas fa-check-circle",
              message: data.message || "Logged out successfully!",
              type: "success",
            });
            window.location.href = "/login.html";
          } else {
            showToast({
              icon: "fas fa-times-circle",
              message: data.message || "Logout failed",
              type: "error",
            });
          }
        } catch (err) {
          console.error("Logout error:", err);
          showToast({
            icon: "fas fa-times-circle",
            message: "Something went wrong. Try again.",
            type: "error",
          });
        }
      });
    </script>
  </body>
</html>
