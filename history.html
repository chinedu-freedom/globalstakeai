<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./loader.js"></script>

  <script src="./protect.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Transaction History - SatrixNow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8; 
      padding-bottom: 70px; 
    }

    .header-bg {
      background: linear-gradient(90deg, #1fa2d0, #167bee);
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 50;
      border-top: 1px solid #f1f5f9;
      height: 64px;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    

    .tab-item {
      position: relative;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      padding: 14px 0;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tab-item.active {
      color: #1fa2d0;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #1fa2d0;
    }

    /* Hide scrollbar */
    .overflow-y-auto::-webkit-scrollbar {
      display: none;
    }
    .overflow-y-auto {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script src="./translator.js"></script>
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md bg-[#eaf0f6] min-h-screen relative shadow-2xl mx-auto border-x border-gray-100 flex flex-col">

    <!-- HEADER -->
    <div class="header-bg text-white px-5 pt-5 pb-5 sticky top-0 z-40">
      <div class="flex items-center relative">
        <a href="javascript:history.back()" class="absolute left-0 p-2 -ml-2 text-white">
          <i class="fas fa-chevron-left text-[15px]"></i>
        </a>
        <h1 class="text-base font-bold w-full text-center tracking-wide">Transactions</h1>
      </div>
    </div>

    <!-- TABS ROW -->
    <div class="bg-white flex items-center justify-around sticky top-[60px] z-30 shadow-sm">
      <div class="flex-1 text-center tab-item active" onclick="switchTab(this, 'deposits')">Deposits</div>
      <div class="flex-1 text-center tab-item" onclick="switchTab(this, 'withdrawals')">Withdrawals</div>
    </div>

    <!-- TRANSACTION LIST STYLES (inline for quick access) -->
    <style>
      .tx-row {
        display: flex;
        align-items: center;
        background: white;
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        gap: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .tx-row:hover { background: #f8faff; }
      .tx-icon {
        width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, #14b8a6, #2563eb);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .badge-pending {
        font-size: 9px; font-weight: 700; padding: 2px 8px;
        border-radius: 999px; background: #fef9c3; color: #b45309; border: 1px solid #fde68a;
      }
      .badge-approved {
        font-size: 9px; font-weight: 700; padding: 2px 8px;
        border-radius: 999px; background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7;
      }
      .badge-failed {
        font-size: 9px; font-weight: 700; padding: 2px 8px;
        border-radius: 999px; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;
      }
    </style>

    <!-- MAIN CONTENT -->
    <div class="flex-1 bg-white">

      <!-- DEPOSITS panel (default active) -->
      <div id="tab-deposits" class="tx-panel">
        <div class="text-center text-gray-400 py-10 text-xs">Loading transactions...</div>
      </div>

      <!-- WITHDRAWALS panel (hidden by default) -->
      <div id="tab-withdrawals" class="tx-panel hidden">
        <div class="text-center text-gray-400 py-10 text-xs">Loading transactions...</div>
      </div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <div class="w-full max-w-[28rem] mx-auto flex justify-around items-center h-full pt-1">
        <a href="/index.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_home">Home</span>
        </a>
        <a href="/plans.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M14.531 12.469 6.619 20.381l-4-4 7.912-7.912" /><path d="M15.686 11.314c.839.839 2.158.888 3.037.125l2.313-2.313a2.673 2.673 0 0 0 0-3.776L18.65 3.015a2.673 2.673 0 0 0-3.776 0L12.56 5.33c-.763.879-.714 2.198.125 3.037Z" /></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_staking">Staking Plans</span>
        </a>
        <a href="/teams.html" class="nav-item flex flex-col items-center w-1/4 text-[#94a3b8] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_team">Team</span>
        </a>
        <a href="/account.html" class="nav-item flex flex-col items-center w-1/4 text-[#4f8cff] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-medium translator" data-key="nav_account">Account</span>
        </a>
      </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>

  </div>
  <script>
    function switchTab(el, type) {
      document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.tx-panel').forEach(panel => panel.classList.add('hidden'));
      const active = document.getElementById('tab-' + type);
      if (active) active.classList.remove('hidden');
    }

    document.addEventListener("DOMContentLoaded", async () => {
       const formatDate = (dateString) => {
           if (!dateString) return '';
           const d = new Date(dateString);
           return d.toLocaleDateString() + ' - ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
       }

       const doFetch = async (url) => {
           try {
               const res = await fetch(url, { credentials: 'include' });
               if (res.status === 401 || res.status === 403) {
                   window.location.href = '/login.html';
                   return null;
               }
               if (!res.ok) return null;
               return await res.json();
           } catch(err) {
               return null;
           }
       };

       const [depRes, withRes] = await Promise.all([
           doFetch('https://api.satrixai.com/api/deposits/history'),
           doFetch('https://api.satrixai.com/api/withdrawals/history')
       ]);
       
       // API shape: { success, data: { data: [...], pagination: {...} } }
       let deposits    = Array.isArray(depRes?.data?.data) ? depRes.data.data : (Array.isArray(depRes?.data) ? depRes.data : []);
       let withdrawals = Array.isArray(withRes?.data?.withdrawals) ? withRes.data.withdrawals : (Array.isArray(withRes?.data?.data) ? withRes.data.data : (Array.isArray(withRes?.data) ? withRes.data : []));

       const formatData = (items, type) => {
           return items.map(item => ({
               id:       item._id || item.id || Math.random().toString(),
               type,
               status:   String(item.status || 'pending').toLowerCase(),
               amount:   parseFloat(item.amount || 0),
               fee:      parseFloat(item.fee || 0),
               netAmount: parseFloat(item.netAmount || (item.amount ? item.amount * 0.94 : 0)),
               // crypto field already contains the full label e.g. "USDT (TRC20)"
               currency: item.crypto || item.currency || item.coinType || 'USDT',
               // _createdAt is the Sanity timestamp field
               date:     item._createdAt || item.requestedAt || item.createdAt || item.fundedAt || item.date || new Date().toISOString()
           }));
       };

       deposits    = formatData(deposits,    'deposit');
       withdrawals = formatData(withdrawals, 'withdrawal');

       const renderList = (containerId, items) => {
           const container = document.getElementById(containerId);
           if (!container) return;

           if (items.length === 0) {
               container.innerHTML = '<div class="text-center text-gray-400 py-10 text-xs">No transactions found</div>';
               return;
           }

           container.innerHTML = items.map(item => {
               const isDeposit = item.type === 'deposit';
               const title = isDeposit ? 'Deposit' : 'Withdrawal';
               
               let svgIcon = isDeposit 
               ? '<path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.418 0-8-3.582-8-8s3.582-8 8-8 8 3.582 8 8-3.582 8-8 8zm-1-5h2V8h-2v7zm0 2h2v-2h-2v2z"/>'
               : '<path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.418 0-8-3.582-8-8s3.582-8 8-8 8 3.582 8 8-3.582 8-8 8zm1-11h-2v3H8l4 4 4-4h-3z"/>';

               let badgeClass = 'badge-pending';
               let badgeText = item.status.charAt(0).toUpperCase() + item.status.slice(1);
               if (item.status === 'approved' || item.status === 'completed' || item.status === 'successful') { badgeClass = 'badge-approved'; badgeText = 'Approved'; }
               if (item.status === 'failed' || item.status === 'rejected') { badgeClass = 'badge-failed'; badgeText = 'Failed'; }

               let amountSign = isDeposit ? '+' : '-';
               let amountColor = isDeposit ? 'text-emerald-500' : 'text-red-500';
               if (badgeClass === 'badge-failed') amountColor = isDeposit ? 'text-emerald-400' : 'text-red-400';

               const displayAmount = isDeposit ? item.amount : item.netAmount;
               const feeText = isDeposit ? '' : ` • Fee: $${item.fee > 0 ? item.fee.toFixed(2) : (item.amount * 0.06).toFixed(2)}`;

               return `
               <div class="tx-row">
                 <div class="tx-icon">
                   <svg width="22" height="22" viewBox="0 0 24 24" fill="white">${svgIcon}</svg>
                 </div>
                 <div class="flex-1 min-w-0">
                   <div class="flex items-center gap-2 mb-0.5">
                     <span class="text-xs font-bold text-gray-800">${title}</span>
                     <span class="${badgeClass}">${badgeText}</span>
                   </div>
                    <p class="text-[10px] text-gray-400 uppercase">${item.currency} • ${formatDate(item.date)}${feeText}</p>
                 </div>
                 <div class="text-right flex-shrink-0 mr-1">
                   <p class="text-xs font-bold ${amountColor}">${amountSign}$${displayAmount.toFixed(2)}</p>
                   <p class="text-[9px] text-gray-400 uppercase">${displayAmount.toFixed(2)} ${item.currency}</p>
                 </div>
               </div>
               `;
           }).join('');
       };

       renderList('tab-deposits', deposits.sort((a,b) => new Date(b.date) - new Date(a.date)));
       renderList('tab-withdrawals', withdrawals.sort((a,b) => new Date(b.date) - new Date(a.date)));
    });
  </script>

</body>
</html>
