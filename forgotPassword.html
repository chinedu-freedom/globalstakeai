<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - Globalstakeai</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

<style>
body {
  font-family: "Poppins", sans-serif;
}

.gradient-bg {
  background: linear-gradient(135deg, #4f8cff, #6ee7ff);
}

.input {
  background: #f8fafc;
  border-radius: 12px;
  padding: 12px 16px;
  width: 100%;
  border: 1px solid #e5e7eb;
}

.btn-gradient {
  background: linear-gradient(90deg, #5eead4, #93c5fd);
}
</style>
</head>

<body class="flex flex-col min-h-screen">

<!-- HEADER -->
<div class="gradient-bg text-white text-center py-16">
  <h1 class="text-xl font-semibold">Globalstakeai</h1>
</div>

<!-- MAIN -->
<div class=" flex justify-center px-4">
  <!-- <div class="bg-white w-full p-6 max-w-md"> -->
  <div class="bg-white w-full p-6 ">

    <!-- Title -->
    <h2 class="text-lg font-semibold text-center mb-2">
      Forgot Password
    </h2>
    <p class="text-sm text-gray-500 text-center mb-6">
      Enter your email to reset your password
    </p>

    <!-- FORM -->
    <form class="space-y-5">

      <!-- Email -->
      <div>
        <label class="text-sm text-gray-500">Email Address</label>
        <input
          type="email"
          placeholder="Enter your email"
          class="input mt-1"
        />
      </div>

      <!-- Submit -->
      <button
        class="w-full py-3 rounded-xl btn-gradient text-white font-semibold"
      >
        Send Reset Link
      </button>

    </form>

    <!-- Back to login -->
    <div class="text-center mt-6 text-sm">
      <span class="text-gray-500">Remember your password?</span>
      <a href="/login.html" class="text-blue-500 ml-1 cursor-pointer">
        Back to Login
      </a>
    </div>

  </div>
</div>

</body>
</html>
