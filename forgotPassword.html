<!doctype html>
<html lang="en">
<head>
  <script src="./loader.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - StakeWiseAi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
<script src="./toast.js"></script>
<style>
body { font-family: "Poppins", sans-serif; }
.gradient-bg { background: linear-gradient(135deg, #4f8cff, #6ee7ff); }
.input {
  background: #f8fafc;
  border-radius: 12px;
  padding: 12px 16px;
  width: 100%;
  border: 1px solid #e5e7eb;
  outline: none;
  font-size: 14px;
  transition: border-color 0.2s;
  font-family: "Poppins", sans-serif;
}
.input:focus { border-color: #93c5fd; }
.input.err { border-color: #ef4444 !important; }
.btn-gradient { background: linear-gradient(90deg, #5eead4, #93c5fd); }
</style>

  <script src="./translator.js"></script>
</head>

<body class="flex flex-col min-h-screen">

<!-- HEADER -->
<div class="gradient-bg text-white text-center py-16">
  <h1 class="text-base font-semibold">StakeWiseAi</h1>
</div>

<!-- MAIN -->
<div class="flex justify-center px-4">
  <div class="bg-white w-full p-6">

    <!-- Back arrow -->
    <a href="/login.html" class="flex items-center gap-2 text-gray-400 text-xs mb-6">
      <i class="fas fa-chevron-left text-xs"></i>
      Back to Login
    </a>

    <!-- Title -->
    <h2 class="text-xs font-semibold text-center mb-2">Forgot Password</h2>
    <p class="text-xs text-gray-500 text-center mb-6">
      Enter your email address and we'll send you a verification code
    </p>

    <!-- FORM -->
    <form class="space-y-5" onsubmit="handleForgotPassword(event)">

      <!-- Email Address -->
      <div>
        <label class="text-xs text-gray-500">Email Address</label>
        <input
          type="email"
          id="fpEmail"
          placeholder="Enter your registered email"
          class="input mt-1"
          oninput="clearErr()"
        />
        <p class="text-red-500 text-[11px] mt-1 hidden" id="fpEmailErr"></p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        id="fpBtn"
        class="w-full py-3 rounded-xl btn-gradient text-white font-semibold flex items-center justify-center gap-2"
      >
        <span id="fpBtnText">Send OTP</span>
        <i class="fas fa-spinner fa-spin hidden" id="fpSpinner"></i>
      </button>

    </form>

    
  </div>
</div>

<script>
const API_BASE = 'https://stakewiseai-server.onrender.com';

function clearErr() {
  const input = document.getElementById('fpEmail');
  const errEl = document.getElementById('fpEmailErr');
  if (input) input.style.borderColor = '';
  if (errEl) errEl.classList.add('hidden');
}

function showInputErr(msg) {
  const input = document.getElementById('fpEmail');
  const errEl = document.getElementById('fpEmailErr');
  if (input) input.style.borderColor = '#ef4444';
  if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
}

function showToast(msg, type = 'success') {
  window.pToast({ message: msg, type: type });
}

function setLoading(on) {
  document.getElementById('fpBtn').disabled = on;
  document.getElementById('fpBtnText').textContent = on ? 'Sending...' : 'Send OTP';
  document.getElementById('fpSpinner').classList.toggle('hidden', !on);
}

async function handleForgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('fpEmail').value.trim();

  if (!email) {
    showInputErr('Please enter your email address');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showInputErr('Please enter a valid email address');
    return;
  }

  setLoading(true);
  try {
    const res  = await fetch(`${API_BASE}/api/auth/request-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (res.ok) {
      // Save email for OTP & reset pages
      sessionStorage.setItem('resetEmail', email);
      showToast('OTP sent! Check your email.', 'success');
      setTimeout(() => window.location.href = '/otp.html', 1400);
    } else {
      showToast(data.message || 'Failed to send OTP. Please try again.', 'error');
    }
  } catch (err) {
    showToast('Network error. Please check your connection.', 'error');
  } finally {
    setLoading(false);
  }
}
</script>

</body>
</html>
