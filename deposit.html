<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Deposit - StakeWiseAi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8; 
      padding-bottom: 70px; 
    }

    .header-bg {
      background: linear-gradient(90deg, #1fa2d0, #4f8cff);
    }
    
    .crypto-btn.active {
      border-color: #4f8cff;
      background-color: #ebf3ff;
    }

    .crypto-btn:hover:not(.active) {
      border-color: #cbd5e1;
      background-color: #f8fafc;
    }

    .btn-gradient {
      background: linear-gradient(90deg, #1fa2d0, #4f8cff);
    }
    .btn-disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

  </style>

  <script src="./translator.js"></script>
</head>
<body class="flex flex-col min-h-screen items-center">

  <div class="w-full max-w-md bg-[#f0f4f8] min-h-screen relative shadow-2xl mx-auto border-x border-gray-100 flex flex-col">

    <!-- HEADER -->
    <div class="header-bg text-white px-5 pt-6 pb-6 sticky top-0 z-40">
      <div class="flex items-center relative">
        <a href="javascript:history.back()" class="absolute left-0 text-white hover:opacity-80 transition">
          <i class="fas fa-chevron-left text-[15px]"></i>
        </a>
        <h1 class="text-base font-bold w-full text-center tracking-wide">Deposit</h1>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="px-5 pt-6 pb-6 space-y-6 flex-1">
      
      <!-- Payment Method -->
      <!-- <div>
        <label class="block text-[11px] text-gray-500 font-medium mb-2 pl-1">Select Payment Method</label>
        <div class="relative">
          <select class="w-full appearance-none bg-[#f8fafc] border border-[#a5c3fb] text-gray-700 text-sm font-medium rounded-xl py-3.5 px-4 focus:outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400 transition cursor-pointer">
            <option value="crypto">Select Crypto Payment Method</option>
            <option value="bank">Bank Transfer (Naira)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
            <i class="fas fa-chevron-down text-xs"></i>
          </div>
        </div>
      </div> -->

      <!-- Select Cryptocurrency -->
      <div>
        <label class="block text-[11px] text-gray-500 font-medium mb-2 pl-1">Select Cryptocurrency</label>
        <div class="grid grid-cols-2 gap-3">
          
          <!-- BTC -->
          <button type="button" class="crypto-btn flex items-center gap-3 bg-[#f8fafc] border border-gray-200 rounded-xl p-3 transition text-left" data-coin="BTC" data-rate="66000" onclick="selectCrypto(this)">
            <img src="https://assets.coingecko.com/coins/images/1/small/bitcoin.png" class="w-7 h-7" alt="BTC" />
            <div>
              <p class="text-[11px] font-bold text-gray-800 leading-tight">BTC</p>
              <p class="text-[9px] text-gray-400 mt-0.5">Bitcoin</p>
            </div>
          </button>

          <!-- USDT TRC20 (Default Active) -->
          <button type="button" class="crypto-btn active flex items-center gap-3 bg-[#f8fafc] border border-gray-200 rounded-xl p-3 transition text-left" data-coin="USDT" data-rate="1" onclick="selectCrypto(this)">
            <img src="https://assets.coingecko.com/coins/images/325/small/Tether.png" class="w-7 h-7" alt="USDT" />
            <div>
              <p class="text-[11px] font-bold text-gray-800 leading-tight">USDT</p>
              <p class="text-[9px] text-gray-400 mt-0.5">TRC20</p>
            </div>
          </button>

          <!-- USDT BEP20 -->
          <button type="button" class="crypto-btn flex items-center gap-3 bg-[#f8fafc] border border-gray-200 rounded-xl p-3 transition text-left" data-coin="USDT" data-rate="1" onclick="selectCrypto(this)">
            <img src="https://assets.coingecko.com/coins/images/325/small/Tether.png" class="w-7 h-7" alt="USDT" />
            <div>
              <p class="text-[11px] font-bold text-gray-800 leading-tight">USDT</p>
              <p class="text-[9px] text-gray-400 mt-0.5">BEP20</p>
            </div>
          </button>

          <!-- BNB BEP20 -->
          <button type="button" class="crypto-btn flex items-center gap-3 bg-[#f8fafc] border border-gray-200 rounded-xl p-3 transition text-left" data-coin="BNB" data-rate="600" onclick="selectCrypto(this)">
            <img src="https://assets.coingecko.com/coins/images/825/small/bnb-icon2_2x.png" class="w-7 h-7" alt="BNB" />
            <div>
              <p class="text-[11px] font-bold text-gray-800 leading-tight">BNB</p>
              <p class="text-[9px] text-gray-400 mt-0.5">BEP20</p>
            </div>
          </button>

        </div>
      </div>

      <!-- Amount Input -->
      <div>
        <label class="block text-[11px] text-gray-500 font-medium mb-2 pl-1">Amount (USD)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <span class="text-gray-500 font-medium text-sm">$</span>
          </div>
          <input type="number" id="depositAmount" class="w-full bg-[#f8fafc] border border-gray-200 text-gray-800 text-sm font-semibold rounded-xl py-3.5 pl-8 pr-4 focus:outline-none focus:ring-1 focus:border-blue-400 focus:ring-blue-400 transition" placeholder="0.00" oninput="calculateAmount()">
        </div>
      </div>

      <!-- Realtime Conversion Box -->
      <div class="bg-[#f8fafc] border border-gray-200 rounded-xl p-4 flex justify-between items-center shadow-sm">
        <span class="text-[11px] text-gray-500 font-medium tracking-wide">You will send</span>
        <div class="text-right">
          <p class="text-sm font-bold text-gray-800 tracking-wide"><span id="convertedAmount">0.00</span> <span id="selectedCoinLabel">USDT</span></p>
          <p class="text-[9px] text-gray-400 mt-0.5 tracking-wide">1 <span id="rateCoinLabel">USDT</span> = $<span id="rateValueLabel">1.00</span></p>
        </div>
      </div>

      <!-- Submit Button -->
      <button id="proceedBtn" class="w-full btn-disabled text-white font-bold py-3.5 rounded-xl text-sm transition mt-2 shadow-sm">
        Proceed to Payment
      </button>

      <!-- Info Box -->
      <div class="bg-[#f0f7ff] rounded-xl p-4 flex items-start gap-3 border border-[#e0efff] mt-4 shadow-sm">
        <i class="fas fa-info-circle text-[#4f8cff] text-[13px] mt-0.5 shrink-0"></i>
        <p class="text-[10px] text-[#4f8cff] leading-relaxed">
          Please ensure you send the exact amount to the provided wallet address. Transactions are typically confirmed within 10-30 minutes.
        </p>
      </div>

    </div>

  </div>

  <script>
    let activeCoin = "USDT";
    let activeRate = 1;

    // Handle crypto selection
    function selectCrypto(buttonElement) {
      // Remove active class from all
      document.querySelectorAll('.crypto-btn').forEach(btn => btn.classList.remove('active'));
      // Add to clicked
      buttonElement.classList.add('active');

      // Update state
      activeCoin = buttonElement.getAttribute('data-coin');
      activeRate = parseFloat(buttonElement.getAttribute('data-rate'));

      calculateAmount();
    }

    // Handle typing in the amount box
    function calculateAmount() {
      const input = document.getElementById('depositAmount').value;
      const parsedAmount = parseFloat(input);
      
      const convertedDisplay = document.getElementById('convertedAmount');
      const coinLabels = document.querySelectorAll('#selectedCoinLabel, #rateCoinLabel');
      const rateDisplay = document.getElementById('rateValueLabel');
      const btn = document.getElementById('proceedBtn');

      // Update structural labels
      coinLabels.forEach(el => el.innerText = activeCoin);
      
      // We assume activeRate is the price of the coin in USD
      // e.g., if Bitcoin is 66000, and user enters 1000 USD, they send 1000 / 66000 BTC.
      let finalAmount = 0;
      if (!isNaN(parsedAmount) && parsedAmount > 0) {
        finalAmount = parsedAmount / activeRate;
      }

      // Format correctly depending on coin
      if (activeCoin === 'BTC' || activeCoin === 'BNB') {
        convertedDisplay.innerText = finalAmount.toFixed(6);
      } else {
        convertedDisplay.innerText = finalAmount.toFixed(2);
      }

      // Format the static rate label for the bottom
      rateDisplay.innerText = activeRate >= 1000 ? activeRate.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : activeRate.toFixed(2);

      // Toggle button states
      if (!isNaN(parsedAmount) && parsedAmount >= 1) {
        btn.classList.remove('btn-disabled');
        btn.classList.add('btn-gradient');
        btn.onclick = () => { alert('Redirecting to Payment Gateway...'); };
      } else {
        btn.classList.add('btn-disabled');
        btn.classList.remove('btn-gradient');
        btn.onclick = null;
      }
    }

    // Initialize state on load
    calculateAmount();
  </script>
</body>
</html>
