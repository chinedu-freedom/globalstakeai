  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f0f4f8; 
      padding-bottom: 70px; 
    }

    .header-bg {
      background: linear-gradient(90deg, #1fa2d0, #167bee);
    }
    
    .btn-gradient {
      background: linear-gradient(90deg, #1fa2d0, #167bee);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 50;
      border-top: 1px solid #f1f5f9;
      height: 64px;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    
    
    .nav-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 4px;
      stroke-width: 2;
    }
    
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    
    
    
    

    /* Modal Animation */
    .modal-enter {
      opacity: 0;
      transform: scale(0.95);
    }
    .modal-enter-active {
      opacity: 1;
      transform: scale(1);
      transition: opacity 300ms, transform 300ms;
    }

    /* Hide Scrollbar */
    .overflow-y-auto::-webkit-scrollbar {
      display: none;
    }
    .overflow-y-auto {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <script src="./translator.js"></script>

<body class="flex flex-col min-h-screen items-center">

    </div>

    <!-- MAIN CONTENT -->
    <div class="px-5 pt-6 flex-1 flex flex-col">

        <i class="fas fa-plus text-xs"></i>
        <span>Add Wallet</span>

          <i class="far fa-credit-card text-3xl text-gray-300"></i>
        </div>
        <h2 class="text-sm font-bold text-gray-800 mb-2 tracking-wide">No wallets saved</h2>
        <p class="text-[11px] text-gray-400 max-w-[200px] leading-relaxed">
          Add your first wallet to get started
        </p>
      </div>

      <!-- WALLETS LIST CONTAINER -->
      <div id="walletsList" class="hidden space-y-4 pb-10">
        <!-- Wallet cards will be injected here -->
      </div>

    </div>

    <!-- ADD WALLET MODAL -->
    <div id="addModal" class="fixed inset-0 z-[60] flex flex-col justify-center hidden px-4">

      <div id="modalOverlay" class="absolute inset-0 bg-black/40 opacity-0 transition-opacity duration-300" onclick="toggleAddModal(false)"></div>
      
      <!-- Modal Content (Centered) -->
      <div class="relative w-full max-w-sm mx-auto bg-white rounded-[32px] shadow-xl transform transition-all scale-95 opacity-0 duration-300 ease-in-out px-6 py-8" id="addModalContent">
        
        <h3 class="text-base font-bold text-gray-800 text-center mb-6">Add Wallet</h3>

        <div class="space-y-5">
          <!-- Select Crypto -->
          <div class="relative">
            <label class="block text-[10px] font-semibold text-gray-500 mb-1.5 ml-1">Select Cryptocurrency</label>
            <button type="button" id="coinTrigger" onclick="toggleCurrencyModal(true)" class="w-full flex items-center justify-between bg-[#f8fafc] border border-gray-100 text-gray-700 text-xs font-medium rounded-xl py-4 px-4 focus:outline-none transition cursor-pointer">
              <div class="flex items-center gap-2">
                <img id="selectedCoinImg" src="https://assets.coingecko.com/coins/images/325/small/Tether.png" class="w-4 h-4 hidden" alt="Coin">
                <span id="selectedCoinText">Choose a cryptocurrency</span>
              </div>
              <i class="fas fa-chevron-down text-[10px] text-gray-400"></i>
            </button>
            <p id="coinError" class="text-[9px] text-red-500 mt-1 ml-1 hidden">Please select a currency</p>
          </div>

          <!-- Wallet Address -->
          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1.5 ml-1">Wallet Address</label>
            <input type="text" id="walletAddressInput" class="w-full bg-[#f8fafc] border border-gray-100 text-gray-800 text-xs rounded-xl py-4 px-4 focus:outline-none focus:ring-1 focus:ring-blue-400 transition" placeholder="Enter wallet address">
            <p id="addressError" class="text-[9px] text-red-500 mt-1 ml-1 hidden">Please enter a valid wallet address</p>
          </div>

          <!-- Label -->
          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1.5 ml-1">Label (Optional)</label>
            <input type="text" id="walletLabelInput" class="w-full bg-[#f8fafc] border border-gray-100 text-gray-800 text-xs rounded-xl py-4 px-4 focus:outline-none focus:ring-1 focus:ring-blue-400 transition" placeholder="e.g. My main wallet">
          </div>

          <div class="flex flex-col gap-3 pt-2">
            <button onclick="addWalletSubmit()" class="w-full btn-gradient active:scale-[0.98] text-white font-bold py-4 rounded-xl text-xs transition shadow-sm">
              Add Wallet
            </button>
            <button onclick="toggleAddModal(false)" class="w-full text-gray-400 font-semibold py-2 text-xs transition hover:text-gray-600">
              Cancel
            </button>
          </div>
        </div>

          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

        <a href="/account.html" class="nav-item flex flex-col items-center w-1/4 text-[#4f8cff] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

  </div>
  <script>
    function toggleAddModal(show) {
      const modal = document.getElementById('addModal');
      const modalContent = document.getElementById('addModalContent');
      const overlay = document.getElementById('modalOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function toggleCurrencyModal(show) {
      const modal = document.getElementById('currencyModal');
      const modalContent = document.getElementById('currencyModalContent');
      const overlay = document.getElementById('currencyOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function selectCurrency(name, imgUrl) {
      const textEl = document.getElementById('selectedCoinText');
      const imgEl = document.getElementById('selectedCoinImg');
      
      textEl.innerText = name;
      imgEl.src = imgUrl;
      imgEl.classList.remove('hidden');
      
      toggleCurrencyModal(false);
    }

    function addWalletSubmit() {
      const coin = document.getElementById('selectedCoinText').innerText;
      const coinImg = document.getElementById('selectedCoinImg').src;
      const address = document.getElementById('walletAddressInput').value.trim();
      const label = document.getElementById('walletLabelInput').value.trim();

      const coinErr = document.getElementById('coinError');
      const addrErr = document.getElementById('addressError');
      const trigger = document.getElementById('coinTrigger');
      const addrInp = document.getElementById('walletAddressInput');

      // RESET ERRORS
      coinErr.classList.add('hidden');
      addrErr.classList.add('hidden');
      trigger.classList.remove('border-red-400');
      addrInp.classList.remove('border-red-400');

      let isValid = true;

      // VALIDATION
      if (coin === 'Choose a cryptocurrency') {
        coinErr.classList.remove('hidden');
        trigger.classList.add('border-red-400');
        isValid = false;
      }
      if (address.length < 10) {
        addrErr.classList.remove('hidden');
        addrInp.classList.add('border-red-400');
        isValid = false;
      }

      if(!isValid) return;

      // SAVE LOGIC
      const newWallet = {
        coin: coin,
        img: coinImg,
        address: address,
        label: label || 'My Wallet', // Fallback if optional label is empty
        id: Date.now()
      };

      let wallets = JSON.parse(localStorage.getItem('savedWallets') || '[]');
      wallets.push(newWallet);
      localStorage.setItem('savedWallets', JSON.stringify(wallets));

      // UI UPDATES
      renderWallets();
      toggleAddModal(false);
      
      // Reset inputs
      document.getElementById('walletAddressInput').value = '';
      document.getElementById('walletLabelInput').value = '';
      document.getElementById('selectedCoinText').innerText = 'Choose a cryptocurrency';
      document.getElementById('selectedCoinImg').classList.add('hidden');
    }

    function renderWallets() {
      const wallets = JSON.parse(localStorage.getItem('savedWallets') || '[]');
      const listContainer = document.getElementById('walletsList');
      const emptyState = document.getElementById('emptyState');

      if (wallets.length === 0) {
        emptyState.classList.remove('hidden');
        listContainer.classList.add('hidden');
      } else {
        emptyState.classList.add('hidden');
        listContainer.classList.remove('hidden');
        listContainer.innerHTML = '';

        wallets.forEach(w => {
          const card = `
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-50 flex items-center justify-between group">
              <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center shrink-0">
                  <img src="${w.img}" class="w-6 h-6" alt="Coin">
                </div>
                <div>
                  <h3 class="text-xs font-bold text-gray-800">${w.label}</h3>
                  <p class="text-[10px] text-gray-400 mt-0.5 truncate max-w-[180px] font-medium">${w.address}</p>
                </div>
              </div>
              <div class="flex flex-col items-end gap-1">
                <span class="text-[9px] font-bold text-[#167bee] bg-[#e8efff] px-2 py-0.5 rounded-full">${w.coin.split(' ')[0]}</span>
                <button onclick="deleteWallet(${w.id})" class="text-gray-300 hover:text-red-400 transition ml-2">
                  <i class="fas fa-trash-alt text-[11px]"></i>
                </button>
              </div>
            </div>
          `;
          listContainer.innerHTML += card;
        });
      }
    }

    let walletToDeleteId = null;

    function deleteWallet(id) {
      const wallets = JSON.parse(localStorage.getItem('savedWallets') || '[]');
      const wallet = wallets.find(w => w.id === id);
      if(!wallet) return;

      walletToDeleteId = id;
      document.getElementById('deleteWalletName').innerText = `"${wallet.label}"`;
      toggleDeleteModal(true);
    }

    function toggleDeleteModal(show) {
      const modal = document.getElementById('deleteModal');
      const modalContent = document.getElementById('deleteModalContent');
      const overlay = document.getElementById('deleteOverlay');

      if(show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
          modalContent.classList.remove('scale-95', 'opacity-0');
          modalContent.classList.add('scale-100', 'opacity-100');
        }, 10);
      } else {
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        modalContent.classList.remove('scale-100', 'opacity-100');
        modalContent.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    }

    function confirmDelete() {
      if(!walletToDeleteId) return;
      let wallets = JSON.parse(localStorage.getItem('savedWallets') || '[]');
      wallets = wallets.filter(w => w.id !== walletToDeleteId);
      localStorage.setItem('savedWallets', JSON.stringify(wallets));
      
      toggleDeleteModal(false);
      renderWallets();
      walletToDeleteId = null;
    }

    // INITIALIZE ON LOAD
    document.addEventListener('DOMContentLoaded', () => {
      renderWallets();
    });
  </script>
